<!DOCTYPE html>
<!-- report_bunseki.html ver.20260820.T02 | 案シス管理部レポート(独立版・項目別タブ) -->
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理部レポート｜大房案件管理システム</title>
<style>
:root{
  --ink:#111418; --ink-2:#5b626b; --ink-3:#9aa1a9;
  --line:#e7e9ec; --line-2:#f1f2f4; --bg:#f6f7f8; --panel:#fff;
  --accent:#e11d2a; --red:#e11d2a; --radius:10px;
  --shadow:0 1px 2px rgba(16,24,40,.05);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;line-height:1.5;font-size:14px}

.topbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;padding:10px 18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px}
.brand .ic{width:22px;height:22px;border-radius:5px;background:linear-gradient(135deg,#111418,#3a3f47);
  color:#fff;display:grid;place-items:center;font-size:12px}
.seg{display:inline-flex;background:#f1f2f4;border-radius:9px;padding:3px}
.seg button{appearance:none;border:0;background:transparent;font:inherit;font-size:13px;color:var(--ink-2);
  padding:6px 14px;border-radius:7px;cursor:pointer}
.seg button.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:var(--shadow)}
.topbar select{border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:inherit;font-size:13px;background:#fff}
.meta{color:var(--ink-2);font-size:12.5px}.meta b{color:var(--ink)}
.spacer{flex:1}
.btn{appearance:none;border:1px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-size:12.5px;
  padding:6px 12px;border-radius:8px;cursor:pointer}
.btn:hover{border-color:#cfd4d9}

.cattabs{background:#fff;border-bottom:1px solid var(--line);padding:0 18px;display:flex;gap:2px;overflow-x:auto}
.cattabs button{appearance:none;border:0;background:transparent;font:inherit;font-size:13.5px;color:var(--ink-2);
  padding:12px 14px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.cattabs button.on{color:var(--ink);font-weight:700;border-bottom-color:var(--accent)}

.wrap{max-width:1080px;margin:0 auto;padding:20px 20px 70px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;box-shadow:var(--shadow);margin-bottom:16px}
.rrange{color:var(--ink-3);font-size:12.5px;margin:0 2px 14px}
.st{font-size:13.5px;font-weight:800;margin:0 0 12px}
.sub{color:var(--ink-3);font-size:11.5px;margin:6px 0 0}

.kgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:22px}
.kgrid.g3{grid-template-columns:repeat(3,1fr)}
.k .kl{font-size:12.5px;color:var(--ink-2);display:flex;align-items:center;gap:5px}
.k .kl .tag{font-size:10px;color:var(--ink-3);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.k .kn{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.15;margin-top:2px}
.k .kn small{font-size:15px;font-weight:700}
.k .kc{font-size:11.5px;color:var(--ink-2);margin-top:3px;line-height:1.7}
.d{font-weight:800}.d.bad{color:var(--red)}.d.ok{color:var(--ink)}
.note{color:var(--ink-3);font-size:11.5px;margin-top:16px;border-top:1px dashed var(--line);padding-top:10px}

table.grid{width:100%;border-collapse:collapse;font-size:12.5px}
table.grid th,table.grid td{padding:8px 10px;text-align:right;white-space:nowrap}
table.grid th{color:var(--ink-2);font-weight:700;border-bottom:1px solid var(--line)}
table.grid td{border-bottom:1px solid var(--line-2)}
table.grid th.l,table.grid td.l{text-align:left}
table.grid td.total,table.grid td.lab{font-weight:700;color:var(--ink)}
table.grid td.total{font-weight:800}
table.grid td.orgs{text-align:left;color:var(--ink-2);font-size:11.5px;white-space:normal;line-height:1.6}
table.grid td.orgs .o{display:inline-block;margin-right:12px}
table.grid td.orgs .o b{color:var(--ink);font-weight:700}
.pct{font-variant-numeric:tabular-nums}

.legend{display:flex;gap:16px;font-size:12px;color:var(--ink-2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:16px;height:2px;display:inline-block}
.chart{width:100%;height:300px}
.tblwrap{overflow-x:auto}
.small{color:var(--ink-3);font-size:11px}
.state{padding:48px;text-align:center;color:var(--ink-2)}
.spin{width:24px;height:24px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;margin:0 auto 12px;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.hidden{display:none!important}
.err{color:var(--accent)}
.foot{color:var(--ink-3);font-size:11px;text-align:center;margin-top:8px}
@media(max-width:920px){.kgrid{grid-template-columns:repeat(3,1fr);gap:16px}table.grid{font-size:11.5px}}
@media print{body{background:#fff}.topbar .btn,.seg,.cattabs{display:none}}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><span class="ic">📊</span>管理部レポート</div>
  <div class="seg" id="ptype">
    <button data-p="week">週次</button>
    <button data-p="month" class="on">月次</button>
  </div>
  <select id="periodPick"></select>
  <div class="meta" id="metaLabel"></div>
  <div class="spacer"></div>
  <button class="btn" id="reloadBtn">↻ 再集計</button>
  <button class="btn" id="printBtn">🖨 印刷</button>
</div>

<div class="cattabs" id="cats">
  <button data-c="summary" class="on">全体サマリー</button>
  <button data-c="counts">登録・申請・在留資格・分野</button>
  <button data-c="lead">リードタイム・審査期間</button>
  <button data-c="tsuikan">追完</button>
</div>

<div class="wrap">
  <div id="loading" class="state"><div class="spin"></div>読み込み中…</div>
  <div id="error" class="state err hidden"></div>
  <div id="app" class="hidden">
    <div class="rrange" id="pvRange"></div>

    <!-- 全体サマリー -->
    <div id="view-summary">
      <div class="card">
        <div class="kgrid" id="kpis"></div>
        <div class="note" id="kpiNote"></div>
      </div>
      <div class="card">
        <p class="st" id="trendTitle">処理量トレンド</p>
        <svg class="chart" id="trendChart" viewBox="0 0 1000 300" preserveAspectRatio="xMidYMid meet"></svg>
        <div class="legend">
          <span><i style="background:#111418"></i>申請</span>
          <span><i style="background:#9aa1a9"></i>審査完了</span>
          <span><i style="background:#e11d2a"></i>COE認定</span>
        </div>
      </div>
    </div>

    <!-- 登録・申請・在留資格・分野 -->
    <div id="view-counts" class="hidden">
      <div class="card">
        <p class="st">指標別内訳（対象期間）</p>
        <div class="tblwrap"><table class="grid" id="brkTable"></table></div>
      </div>
      <div class="card">
        <p class="st">在留資格別 内訳（登録・申請）</p>
        <div class="tblwrap"><table class="grid" id="visaTable"></table></div>
        <p class="small" id="visaNote" style="margin-top:8px"></p>
      </div>
      <div class="card">
        <p class="st">分野別 内訳（登録・申請）</p>
        <div class="tblwrap"><table class="grid" id="fieldTable"></table></div>
      </div>
    </div>

    <!-- リードタイム・審査期間 -->
    <div id="view-lead" class="hidden">
      <div class="card">
        <p class="st">リードタイム：登録 → 申請（対象期間 申請分・種別別）</p>
        <table class="grid" id="leadTable"></table>
        <p class="small" id="leadNote" style="margin-top:8px"></p>
      </div>
      <div class="card">
        <p class="st" id="shinsaTitle">審査期間（申請 → 審査完了）</p>
        <div class="kgrid g3" id="shinsaKpi"></div>
      </div>
      <div class="card">
        <p class="st">種別別 審査期間（全体／特定技能／特定技能以外）</p>
        <table class="grid" id="shinsaTypeTable"></table>
      </div>
      <div class="card">
        <p class="st">在留資格別 審査期間</p>
        <div class="tblwrap"><table class="grid" id="shinsaVisaTable"></table></div>
      </div>
    </div>

    <!-- 追完 -->
    <div id="view-tsuikan" class="hidden">
      <div class="card">
        <p class="st">追完発生率（対象期間 申請分）</p>
        <table class="grid" id="tsuikanRate"></table>
        <p class="small" style="margin-top:8px">※ 申請件数を分母、同期間の追完件数を分子とした発生率（目安）。</p>
      </div>
      <div class="card">
        <p class="st">追完 内訳（対象期間）</p>
        <div class="tblwrap"><table class="grid" id="tsuikanBrk"></table></div>
      </div>
      <div class="card">
        <p class="st" id="tsuikanTrendTitle">追完件数の推移</p>
        <svg class="chart" id="tsuikanChart" viewBox="0 0 1000 300" preserveAspectRatio="xMidYMid meet"></svg>
        <div class="legend"><span><i style="background:#e11d2a"></i>追完</span></div>
      </div>
    </div>

    <div class="foot" id="updated"></div>
  </div>
</div>

const g=id=>document.getElementById(id);
const nf=n=>Number(n||0).toLocaleString();
const round=x=>Math.round(x);
function median(a){if(!a.length)return null;const s=[...a].sort((x,y)=>x-y);const m=s.length>>1;return s.length%2?s[m]:Math.round((s[m-1]+s[m])/2);}
function prevMonthKey(){const t=new Date();const d=new Date(t.getFullYear(),t.getMonth()-1,1);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");}
function curMonthKey(){const t=new Date();return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0");}
function monthLabel(k){const[y,m]=k.split("-");let s=`${y}年${+m}月`;if(k===prevMonthKey())s+="（先月）";else if(k===curMonthKey())s+="（今月）";return s;}
function weekLabel(k){const d=SNAP.week[k];return d?`${k} 〜 ${d.to}`:k;}
function keysOf(){return PTYPE==="month"?MKEYS:WKEYS;}
function curData(){return SNAP[PTYPE][PKEY];}
function inRange(s,from,to){const m=String(s||"").slice(0,10);return /^\d{4}-\d{2}-\d{2}$/.test(m)&&m>=from&&m<=to;}

/* 比較 */
function compare(metric){
  const keys=keysOf(),i=keys.indexOf(PKEY);
  const val=k=>SNAP[PTYPE][k]?.counts?.[metric]??0;
  const c=val(PKEY),prev=i>0?val(keys[i-1]):null;
  const p3=[keys[i-1],keys[i-2],keys[i-3]].filter(Boolean).map(val);
  const avg3=p3.length?p3.reduce((a,b)=>a+b,0)/p3.length:null;
  return {c,prev,avg3};
}
function deltaHtml(cur,base,less){
  if(base==null)return `<span class="d ok">—</span>`;
  if(base===0)return `<span class="d ok">${cur>0?"新規":"±0"}</span>`;
  const p=round((cur-base)/base*100),bad=less?p>0:p<0,arrow=p>0?"▲":(p<0?"▼":"±"),sign=p>0?"+":"";
  return `<span class="d ${bad?"bad":"ok"}">${arrow} ${sign}${p}%</span>`;
}

/* 折れ線 */
function lineChart(elId,win,series,colors){
  const all=[].concat(...Object.values(series)),max=Math.max(10,...all);
  const W=1000,Hh=300,pl=48,pr=20,pt=24,pb=34,iw=W-pl-pr,ih=Hh-pt-pb,n=win.length;
  const X=i=>pl+(n<=1?iw/2:iw*i/(n-1)),Y=v=>pt+ih-(v/max*ih);
  let s="";const ticks=4;
  for(let t=0;t<=ticks;t++){const val=Math.round(max*t/ticks),y=Y(val);
    s+=`<line x1="${pl}" y1="${y}" x2="${W-pr}" y2="${y}" stroke="#eef0f2"/><text x="${pl-8}" y="${y+4}" text-anchor="end" font-size="11" fill="#9aa1a9">${val}</text>`;}
  win.forEach((k,i)=>{const p=k.split("-");const lab=PTYPE==="month"?(+p[1]+"月"):(+p[1]+"/"+ +p[2]);
    s+=`<text x="${X(i)}" y="${Hh-12}" text-anchor="middle" font-size="11" fill="#9aa1a9">${lab}</text>`;});
  Object.keys(series).forEach(name=>{
    const pts=series[name].map((v,i)=>`${X(i)},${Y(v)}`).join(" ");
    s+=`<polyline points="${pts}" fill="none" stroke="${colors[name]}" stroke-width="2.2" stroke-linejoin="round"/>`;
    series[name].forEach((v,i)=>{s+=`<circle cx="${X(i)}" cy="${Y(v)}" r="3.4" fill="#fff" stroke="${colors[name]}" stroke-width="2"/><text x="${X(i)}" y="${Y(v)-9}" text-anchor="middle" font-size="10.5" fill="${colors[name]}" font-weight="700">${v}</text>`;});
  });
  g(elId).innerHTML=s;
}
function trendWindow(){const keys=keysOf(),i=keys.indexOf(PKEY);return keys.slice(Math.max(0,i-5),i+1);}

/* ===== 全体サマリー ===== */
function renderSummary(){
  const data=curData();if(!data)return;
  g("kpis").innerHTML=METRICS.map(m=>{
    const cm=compare(m.key);
    const pl=PTYPE==="week"?"前週比":"前月比",al=PTYPE==="week"?"3週平均比":"3ヶ月平均比";
    return `<div class="k"><div class="kl">${m.key}${m.less?'<span class="tag">少なめ良</span>':''}</div>
      <div class="kn">${nf(data.counts[m.key])}</div>
      <div class="kc">${pl} ${deltaHtml(cm.c,cm.prev,m.less)}<br>${al} ${deltaHtml(cm.c,cm.avg3,m.less)}</div></div>`;
  }).join("");
  g("kpiNote").innerHTML = PTYPE==="month"
    ? '※「登録」の3ヶ月平均は初期の一括登録の影響で高く出る場合があります。前月比を優先して読んでください。'
    : '※ 各指標は対象週（月〜日）の件数です。';
  const win=trendWindow();
  const ser={申請:[],審査完了:[],"COE認定":[]};
  win.forEach(k=>{const c=SNAP[PTYPE][k].counts;ser.申請.push(c.申請||0);ser.審査完了.push(c.審査完了||0);ser["COE認定"].push(c["COE認定"]||0);});
  lineChart("trendChart",win,ser,{申請:"#111418",審査完了:"#9aa1a9","COE認定":"#e11d2a"});
  g("trendTitle").textContent=PTYPE==="week"?"処理量トレンド（直近6週）":"処理量トレンド（直近6ヶ月）";
}

/* ===== 登録・申請・在留資格・分野 ===== */
function renderBreakdownTable(data){
  let h=`<thead><tr><th class="l">指標</th><th>認定</th><th>変更</th><th>更新</th><th>他</th><th>計</th><th class="l">主要所属機関 上位3</th></tr></thead><tbody>`;
  METRICS.forEach(m=>{
    const b=data.breakdown[m.key]||{byType:{},byOrg:{}},bt=b.byType||{};
    const orgs=Object.entries(b.byOrg||{}).sort((a,c)=>c[1]-a[1]).slice(0,3).map(([n,v])=>`<span class="o">${n} <b>${v}</b></span>`).join("");
    h+=`<tr><td class="l lab">${m.key}</td><td>${nf(bt["認定"]||0)}</td><td>${nf(bt["変更"]||0)}</td><td>${nf(bt["更新"]||0)}</td><td>${nf(bt["他"]||0)}</td><td class="total">${nf(data.counts[m.key])}</td><td class="orgs">${orgs||"—"}</td></tr>`;
  });
  g("brkTable").innerHTML=h+"</tbody>";
}
function thead3(label){return `<thead><tr><th class="l">${label}</th><th>登録</th><th>申請</th></tr></thead>`;}
function aggDim(rows,dim,from,to){
  const reg={},app={};
  rows.forEach(r=>{const key=(r[dim]||"（未設定）");
    if(inRange(r.created_at,from,to))reg[key]=(reg[key]||0)+1;
    if(inRange(r.receipt_date,from,to))app[key]=(app[key]||0)+1;});
  return {reg,app};
}
function dimTableHtml(label,agg){
  let keys=Object.keys(Object.assign({},agg.reg,agg.app));
  keys.sort((a,b)=>((agg.reg[b]||0)+(agg.app[b]||0))-((agg.reg[a]||0)+(agg.app[a]||0)));
  const TOP=20,shown=keys.slice(0,TOP),rest=keys.slice(TOP);
  let rReg=0,rApp=0;rest.forEach(k=>{rReg+=agg.reg[k]||0;rApp+=agg.app[k]||0;});
  let tReg=0,tApp=0;keys.forEach(k=>{tReg+=agg.reg[k]||0;tApp+=agg.app[k]||0;});
  let b=shown.map(k=>`<tr><td class="l lab">${k}</td><td>${nf(agg.reg[k]||0)}</td><td>${nf(agg.app[k]||0)}</td></tr>`).join("");
  if(rest.length)b+=`<tr><td class="l">その他（${rest.length}）</td><td>${nf(rReg)}</td><td>${nf(rApp)}</td></tr>`;
  b+=`<tr><td class="l total">計</td><td class="total">${nf(tReg)}</td><td class="total">${nf(tApp)}</td></tr>`;
  return thead3(label)+`<tbody>${b}</tbody>`;
}
async function renderCounts(){
  const data=curData();if(!data)return;
  renderBreakdownTable(data);
  const from=data.from,to=data.to;
  const loading=`<tbody><tr><td class="l" colspan="3"><span class="small">読み込み中…</span></td></tr></tbody>`;
  g("visaTable").innerHTML=thead3("在留資格")+loading;
  g("fieldTable").innerHTML=thead3("分野")+loading;
  g("visaNote").textContent="";
  let rows;
  try{rows=await loadCases();}
  catch(e){
    const note=`<tbody><tr><td class="l" colspan="3"><span class="small">公開URL（ホスティング先）でライブ表示されます。プレビューでは取得できません。</span></td></tr></tbody>`;
    g("visaTable").innerHTML=thead3("在留資格")+note;
    g("fieldTable").innerHTML=thead3("分野")+note;
    return;
  }
  g("visaTable").innerHTML=dimTableHtml("在留資格",aggDim(rows,"current_status",from,to));
  g("fieldTable").innerHTML=dimTableHtml("分野",aggDim(rows,"applicant_field",from,to));
  g("visaNote").textContent="※ 登録＝レコード作成日、申請＝申請受付日で対象期間を判定。在留資格・分野は現在の案件情報を集計。";
}

/* ===== リードタイム・審査期間 ===== */
async function renderLead(){
  const data=curData();if(!data)return;
  const from=data.from,to=data.to;
  g("leadTable").innerHTML=`<thead><tr><th class="l">種別</th><th>件数</th><th>平均</th><th>中央値</th></tr></thead><tbody><tr><td class="l" colspan="4"><span class="small">読み込み中…</span></td></tr></tbody>`;
  let rows;
  try{rows=await loadCases();}
  catch(e){
    g("leadTable").innerHTML=`<thead><tr><th class="l">種別</th><th>件数</th><th>平均</th><th>中央値</th></tr></thead><tbody><tr><td class="l" colspan="4"><span class="small">公開URLでライブ表示されます（プレビュー不可）。</span></td></tr></tbody>`;
    g("leadNote").textContent="";
  }
  if(rows){
    const body=TYPES.map(tp=>{
      const set=rows.filter(r=>r.app_type===tp&&inRange(r.receipt_date,from,to));
      const days=set.map(r=>Math.round((new Date(String(r.receipt_date).slice(0,10))-new Date(String(r.created_at).slice(0,10)))/86400000)).filter(d=>d>=0&&d<400);
      const avg=days.length?round(days.reduce((a,b)=>a+b,0)/days.length):null,med=median(days);
      return `<tr><td class="l lab">${tp}</td><td>${nf(set.length)}</td><td>${avg==null?"—":avg+"日"}</td><td>${med==null?"—":med+"日"}</td></tr>`;
    }).join("");
    g("leadTable").innerHTML=`<thead><tr><th class="l">種別</th><th>件数</th><th>平均</th><th>中央値</th></tr></thead><tbody>${body}</tbody>`;
    g("leadNote").textContent="※ 登録＝レコード作成日、申請＝申請受付日として cases から算出（参考値）。";
  }
  // 審査期間（shinsa は月次集計）
  const sk=PTYPE==="month"?PKEY:String(data.to).slice(0,7);
  const d=SNAP.shinsa[sk];
  g("shinsaTitle").textContent=PTYPE==="month"?"審査期間（申請 → 審査完了）":`審査期間（申請 → 審査完了）※月次集計・該当月 ${sk}`;
  if(!d){g("shinsaKpi").innerHTML=`<div class="k"><div class="kl">審査完了</div><div class="kn">—</div></div>`;g("shinsaTypeTable").innerHTML="";g("shinsaVisaTable").innerHTML="";return;}
  g("shinsaKpi").innerHTML=`
    <div class="k"><div class="kl">審査完了 件数</div><div class="kn">${nf(d.overall?.n||0)}</div></div>
    <div class="k"><div class="kl">平均 審査期間</div><div class="kn">${d.overall?.avg??"—"}<small> 日</small></div></div>
    <div class="k"><div class="kl">中央値 審査期間</div><div class="kn">${d.overall?.med??"—"}<small> 日</small></div></div>`;
  let h=`<thead><tr><th class="l">種別</th><th class="l">区分</th><th>件数</th><th>平均</th><th>中央値</th></tr></thead><tbody>`;
  const segs=[["all","全体"],["tk","特定技能"],["noTk","特定技能以外"]];
  TYPES.forEach(tp=>{const bt=d.byType?.[tp];if(!bt)return;
    segs.forEach(([sk2,sl],i)=>{const o=bt[sk2]||{};h+=`<tr><td class="l ${i===0?'lab':''}">${i===0?tp:""}</td><td class="l">${sl}</td><td>${nf(o.n||0)}</td><td>${o.avg??"—"}日</td><td>${o.med??"—"}日</td></tr>`;});});
  g("shinsaTypeTable").innerHTML=h+"</tbody>";
  const vis=Object.entries(d.byResidence||{}).sort((a,b)=>b[1].n-a[1].n);
  let v=`<thead><tr><th class="l">在留資格</th><th>件数</th><th>平均</th><th>中央値</th><th>特定技能率</th></tr></thead><tbody>`;
  vis.forEach(([name,o])=>{v+=`<tr><td class="l lab">${name}</td><td>${nf(o.n)}</td><td>${o.avg}日</td><td>${o.med}日</td><td class="pct">${o.tkRate}%</td></tr>`;});
  g("shinsaVisaTable").innerHTML=v+"</tbody>";
}

/* ===== 追完 ===== */
function renderTsuikan(){
  const data=curData();if(!data)return;
  const appT=data.breakdown["申請"]?.byType||{},tkT=data.breakdown["追完"]?.byType||{};
  let h=`<thead><tr><th class="l">種別</th><th>申請</th><th>追完</th><th>発生率</th></tr></thead><tbody>`;
  [...TYPES,"他"].forEach(tp=>{const a=appT[tp]||0,k=tkT[tp]||0,rate=a?round(k/a*100):null;
    h+=`<tr><td class="l lab">${tp}</td><td>${nf(a)}</td><td>${nf(k)}</td><td class="pct">${rate==null?"—":rate+"%"}</td></tr>`;});
  const tA=data.counts["申請"]||0,tK=data.counts["追完"]||0;
  h+=`<tr><td class="l total">計</td><td class="total">${nf(tA)}</td><td class="total">${nf(tK)}</td><td class="total pct">${tA?round(tK/tA*100)+"%":"—"}</td></tr></tbody>`;
  g("tsuikanRate").innerHTML=h;
  // 内訳
  const b=data.breakdown["追完"]||{byType:{},byOrg:{}},bt=b.byType||{};
  const orgs=Object.entries(b.byOrg||{}).sort((a,c)=>c[1]-a[1]).slice(0,3).map(([n,v])=>`<span class="o">${n} <b>${v}</b></span>`).join("");
  g("tsuikanBrk").innerHTML=`<thead><tr><th class="l">指標</th><th>認定</th><th>変更</th><th>更新</th><th>他</th><th>計</th><th class="l">主要所属機関 上位3</th></tr></thead><tbody>
    <tr><td class="l lab">追完</td><td>${nf(bt["認定"]||0)}</td><td>${nf(bt["変更"]||0)}</td><td>${nf(bt["更新"]||0)}</td><td>${nf(bt["他"]||0)}</td><td class="total">${nf(tK)}</td><td class="orgs">${orgs||"—"}</td></tr></tbody>`;
  // 推移
  const win=trendWindow(),ser={追完:win.map(k=>SNAP[PTYPE][k].counts["追完"]||0)};
  lineChart("tsuikanChart",win,ser,{追完:"#e11d2a"});
  g("tsuikanTrendTitle").textContent=PTYPE==="week"?"追完件数の推移（直近6週）":"追完件数の推移（直近6ヶ月）";
}

/* ===== ビュー制御 ===== */
function renderCurrent(){
  const data=curData();if(!data)return;
  g("pvRange").textContent=`${data.from} 〜 ${data.to}`;
  const pl=PTYPE==="week"?"前週・3週平均":"前月・3ヶ月平均";
  g("metaLabel").innerHTML=`対象: <b>${PKEY}</b> ／ 比較: ${pl}`;
  if(CAT==="summary")renderSummary();
  else if(CAT==="counts")renderCounts();
  else if(CAT==="lead")renderLead();
  else if(CAT==="tsuikan")renderTsuikan();
}
function applyView(){
  ["summary","counts","lead","tsuikan"].forEach(c=>g("view-"+c).classList.toggle("hidden",c!==CAT));
  document.querySelectorAll("#cats button").forEach(b=>b.classList.toggle("on",b.dataset.c===CAT));
  renderCurrent();
}
function fillPeriodPick(){
  const keys=keysOf().slice().reverse();
  g("periodPick").innerHTML=keys.map(k=>`<option value="${k}">${PTYPE==="week"?weekLabel(k):monthLabel(k)}</option>`).join("");
  if(!PKEY||!keys.includes(PKEY))PKEY=keys[0];
  g("periodPick").value=PKEY;
}
function setDefaults(){
  if(PTYPE==="month"){if(!PKEY||!MKEYS.includes(PKEY))PKEY=MKEYS.includes(prevMonthKey())?prevMonthKey():MKEYS[MKEYS.length-1];}
  else{if(!PKEY||!WKEYS.includes(PKEY))PKEY=WKEYS[WKEYS.length-1];}
}
function setStatus(){
  g("updated").textContent = VER+"　"+(DATA_MODE==="live"
    ? ("ライブ最新 "+new Date().toLocaleString("ja-JP"))
    : "埋め込みデータ表示（プレビュー／オフライン）— ホスティング先ではライブ更新されます");
}

async function boot(){
  g("error").classList.add("hidden");
  ingest(SNAP_BAKED);DATA_MODE="baked";setDefaults();
  g("loading").classList.add("hidden");g("app").classList.remove("hidden");
  fillPeriodPick();applyView();setStatus();
  try{CASES=null;await tryLiveSnapshots();setDefaults();fillPeriodPick();applyView();setStatus();}
  catch(e){DATA_MODE="baked";setStatus();}
}

/* events */
g("ptype").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;PTYPE=b.dataset.p;PKEY=null;
  document.querySelectorAll("#ptype button").forEach(x=>x.classList.toggle("on",x.dataset.p===PTYPE));
  setDefaults();fillPeriodPick();renderCurrent();});
g("cats").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;CAT=b.dataset.c;applyView();});
g("periodPick").addEventListener("change",e=>{PKEY=e.target.value;renderCurrent();});
g("reloadBtn").addEventListener("click",boot);
g("printBtn").addEventListener("click",()=>window.print());
boot();
</script>
