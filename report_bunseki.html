<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理部レポート｜大房案件管理システム</title>
<style>
:root{
  --ink:#111418; --ink-2:#5b626b; --ink-3:#9aa1a9;
  --line:#e7e9ec; --line-2:#f1f2f4; --bg:#f6f7f8; --panel:#fff;
  --accent:#e11d2a; --accent-2:#c8102e; --good:#0f172a;
  --black:#111418; --gray:#9aa1a9; --red:#e11d2a;
  --radius:10px; --shadow:0 1px 2px rgba(16,24,40,.05);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;line-height:1.5;font-size:14px}

/* ===== トップバー ===== */
.topbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;padding:10px 18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px}
.brand .ic{width:22px;height:22px;border-radius:5px;background:linear-gradient(135deg,#111418,#3a3f47);
  color:#fff;display:grid;place-items:center;font-size:12px}
.tabs{display:inline-flex;background:#f1f2f4;border-radius:9px;padding:3px}
.tabs button{appearance:none;border:0;background:transparent;font:inherit;font-size:13px;color:var(--ink-2);
  padding:6px 15px;border-radius:7px;cursor:pointer;display:flex;align-items:center;gap:5px}
.tabs button.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:var(--shadow)}
.meta{color:var(--ink-2);font-size:12.5px}
.meta b{color:var(--ink)}
.spacer{flex:1}
.btn{appearance:none;border:1px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-size:12.5px;
  padding:6px 12px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:#cfd4d9}

.wrap{max-width:1080px;margin:0 auto;padding:22px 20px 70px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;box-shadow:var(--shadow);margin-bottom:16px}

/* ===== レポート見出し ===== */
.rhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.rhead h2{margin:0;font-size:19px;font-weight:800}
.rhead select{border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:inherit;font-size:13px;background:#fff}
.rrange{color:var(--ink-3);font-size:12.5px;margin:2px 0 18px}

/* ===== KPI ===== */
.kgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:22px}
.k .kl{font-size:12.5px;color:var(--ink-2);display:flex;align-items:center;gap:5px}
.k .kl .tag{font-size:10px;color:var(--ink-3);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.k .kn{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.15;margin-top:2px}
.k .kc{font-size:11.5px;color:var(--ink-2);margin-top:3px;line-height:1.7}
.k .kc .d{font-weight:800}
.d.bad{color:var(--red)} .d.ok{color:var(--ink)}
.note{color:var(--ink-3);font-size:11.5px;margin-top:16px;border-top:1px dashed var(--line);padding-top:10px}

/* ===== セクションタイトル ===== */
.st{font-size:13.5px;font-weight:800;margin:0 0 12px}

/* ===== テーブル ===== */
table.grid{width:100%;border-collapse:collapse;font-size:12.5px}
table.grid th,table.grid td{padding:8px 10px;text-align:right;white-space:nowrap}
table.grid th{color:var(--ink-2);font-weight:700;border-bottom:1px solid var(--line)}
table.grid td{border-bottom:1px solid var(--line-2)}
table.grid th.l,table.grid td.l{text-align:left}
table.grid td.total{font-weight:800}
table.grid td.orgs{text-align:left;color:var(--ink-2);font-size:11.5px;white-space:normal;line-height:1.6}
table.grid td.orgs .o{display:inline-block;margin-right:12px}
table.grid td.orgs .o b{color:var(--ink);font-weight:700}
table.grid tr td.lab{font-weight:700;color:var(--ink)}

/* ===== 折れ線 ===== */
.legend{display:flex;gap:16px;font-size:12px;color:var(--ink-2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:16px;height:2px;display:inline-block}
.chart{width:100%;height:300px}

.pct{font-variant-numeric:tabular-nums}
td.hot{color:var(--red);font-weight:800}
.acts{list-style:none;margin:0;padding:0}
.acts li{padding:9px 0;border-bottom:1px solid var(--line-2);font-size:13px;display:flex;gap:9px;align-items:flex-start}
.acts li:before{content:"→";color:var(--accent);font-weight:800}
.acts li b{color:var(--red)}
.subhead{font-size:12px;color:var(--ink-3);margin:0 0 10px}
.tabs.sub button{font-size:12.5px;padding:5px 12px}
.state{padding:48px;text-align:center;color:var(--ink-2)}
.spin{width:24px;height:24px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;margin:0 auto 12px;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.hidden{display:none!important}
.err{color:var(--accent)}
.foot{color:var(--ink-3);font-size:11px;text-align:center;margin-top:8px}
.small{color:var(--ink-3);font-size:11px}

@media(max-width:920px){
  .kgrid{grid-template-columns:repeat(3,1fr);gap:16px}
  table.grid{font-size:11.5px}
}
@media print{body{background:#fff}.topbar .btn,.tabs{display:none}}
</style>
</head>

<div class="topbar">
  <div class="brand"><span class="ic">📊</span>管理部レポート</div>

  <div class="spacer"></div>

</div>

<div class="wrap">
  <div id="loading" class="state"><div class="spin"></div>読み込み中…</div>

  <div id="app" class="hidden">

    <!-- ===== 月次 / 週次 共通ビュー ===== -->
    <div id="periodView">
      <div class="card">

        <div class="kgrid" id="kpis"></div>

        </div>

      <div class="card">
        <p class="st" id="trendTitle">処理量トレンド（直近6ヶ月）</p>

        <div class="legend">
          <span><i style="background:#111418"></i>申請</span>
          <span><i style="background:#9aa1a9"></i>審査完了</span>
          <span><i style="background:#e11d2a"></i>COE認定</span>
        </div>
      </div>

      <div class="card" id="leadCard">

        <table class="grid" id="leadTable"></table>
        <p class="small" id="leadNote" style="margin-top:8px"></p>
      </div>

      <div class="card">
        <p class="st">追完発生率（対象期間 申請分）</p>
        <table class="grid" id="tsuikanTable"></table>
        <p class="small" style="margin-top:8px">※ 申請件数を分母、同期間の追完件数を分子とした発生率（目安）。</p>
      </div>
    </div>

    <!-- ===== 審査期間ビュー ===== -->
    <div id="shinsaView" class="hidden">
      <div class="card">
        <div class="rhead">

          <select id="shinsaPick"></select>
        </div>
        <div class="rrange">申請 → 審査完了 までの日数（対象月に審査完了した案件）</div>
        <div class="kgrid" id="shinsaKpi" style="grid-template-columns:repeat(3,1fr)"></div>
      </div>
      <div class="card">
        <p class="st">種別別 審査期間（全体／特定技能／特定技能以外）</p>
        <table class="grid" id="shinsaTypeTable"></table>
      </div>
      <div class="card">

        <div style="overflow-x:auto"><table class="grid" id="shinsaVisaTable"></table></div>
      </div>
    </div>

      </div>
      <div id="anBody"></div>
    </div>

    <div class="foot" id="updated"></div>
  </div>
</div>

function ingest(rows){
  SNAP={month:{},week:{},shinsa:{}};

const nf=n=>Number(n||0).toLocaleString();
function round(x){return Math.round(x);}
function median(a){if(!a.length)return null;const s=[...a].sort((x,y)=>x-y);const m=s.length>>1;return s.length%2?s[m]:Math.round((s[m-1]+s[m])/2);}
function prevMonthKey(){const t=new Date();const d=new Date(t.getFullYear(),t.getMonth()-1,1);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");}
function curMonthKey(){const t=new Date();return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0");}
function monthLabel(k){const[y,m]=k.split("-");let s=`${y}年${+m}月`;if(k===prevMonthKey())s+="（先月）";else if(k===curMonthKey())s+="（今月）";return s;}
function weekLabel(k){const d=SNAP.week[k];return d?`${k} 〜 ${d.to}`:k;}

/* ---------- 比較（前期・3期平均） ---------- */
function compare(keys,cur,metric){
  const i=keys.indexOf(cur);
  const val=k=>SNAP[TAB==="week"?"week":"month"][k]?.counts?.[metric]??0;
  const c=val(cur);
  const prev=i>0?val(keys[i-1]):null;
  const p3=[keys[i-1],keys[i-2],keys[i-3]].filter(Boolean).map(val);
  const avg3=p3.length?p3.reduce((a,b)=>a+b,0)/p3.length:null;
  return {c,prev,avg3};
}
function deltaHtml(cur,base,less){
  if(base===null||base===undefined)return `<span class="d ok">—</span>`;
  if(base===0)return `<span class="d ok">${cur>0?"新規":"±0"}</span>`;
  const p=round((cur-base)/base*100);
  const bad = less ? p>0 : p<0;
  const arrow = p>0?"▲":(p<0?"▼":"±");
  const sign = p>0?"+":"";
  return `<span class="d ${bad?"bad":"ok"}">${arrow} ${sign}${p}%</span>`;
}

/* ---------- KPI描画（月次/週次） ---------- */
function renderKPIs(keys,cur){
  const data=SNAP[TAB==="week"?"week":"month"][cur];
  g("kpis").innerHTML=METRICS.map(m=>{
    const cm=compare(keys,cur,m.key);
    const cmpPrevLabel=TAB==="week"?"前週比":"前月比";
    const cmpAvgLabel=TAB==="week"?"3週平均比":"3ヶ月平均比";
    return `<div class="k">
      <div class="kl">${m.key}${m.less?'<span class="tag">少なめ良</span>':''}</div>
      <div class="kn">${nf(data.counts[m.key])}</div>
      <div class="kc">${cmpPrevLabel} ${deltaHtml(cm.c,cm.prev,m.less)}<br>${cmpAvgLabel} ${deltaHtml(cm.c,cm.avg3,m.less)}</div>
    </div>`;
  }).join("");
  g("kpiNote").innerHTML = TAB==="month"
    ? '※「登録」の3ヶ月平均は初期の一括登録の影響で高く出る場合があります。前月比を優先して読んでください。'
    : '※ 各指標は対象週（月〜日）の件数です。';
}

/* ---------- 処理量トレンド（折れ線 SVG） ---------- */
function renderTrend(cur){
  const src=TAB==="week"?"week":"month";
  const keys=TAB==="week"?WKEYS:MKEYS;
  const i=keys.indexOf(cur);
  const span=6;
  const win=keys.slice(Math.max(0,i-span+1),i+1);
  const series={申請:[],審査完了:[],"COE認定":[]};
  win.forEach(k=>{const c=SNAP[src][k].counts;series.申請.push(c.申請||0);series.審査完了.push(c.審査完了||0);series["COE認定"].push(c["COE認定"]||0);});
  const all=[].concat(...Object.values(series));
  const max=Math.max(10,...all);
  const W=1000,Hh=300,pl=48,pr=20,pt=24,pb=34;
  const iw=W-pl-pr, ih=Hh-pt-pb;
  const n=win.length;
  const X=idx=>pl+(n<=1?iw/2:iw*idx/(n-1));
  const Y=v=>pt+ih-(v/max*ih);
  // grid
  let s="";
  const ticks=4;
  for(let t=0;t<=ticks;t++){const val=Math.round(max*t/ticks);const y=Y(val);
    s+=`<line x1="${pl}" y1="${y}" x2="${W-pr}" y2="${y}" stroke="#eef0f2"/>`;
    s+=`<text x="${pl-8}" y="${y+4}" text-anchor="end" font-size="11" fill="#9aa1a9">${val}</text>`;}
  // x labels
  win.forEach((k,idx)=>{let lab;if(src==="month"){lab=(+k.split("-")[1])+"月";}else{const md=k.split("-");lab=`${+md[1]}/${+md[2]}`;}
    s+=`<text x="${X(idx)}" y="${Hh-12}" text-anchor="middle" font-size="11" fill="#9aa1a9">${lab}</text>`;});
  const colors={申請:"#111418",審査完了:"#9aa1a9","COE認定":"#e11d2a"};
  Object.keys(series).forEach(name=>{
    const pts=series[name].map((v,idx)=>`${X(idx)},${Y(v)}`).join(" ");
    s+=`<polyline points="${pts}" fill="none" stroke="${colors[name]}" stroke-width="2.2" stroke-linejoin="round"/>`;
    series[name].forEach((v,idx)=>{
      s+=`<circle cx="${X(idx)}" cy="${Y(v)}" r="3.4" fill="#fff" stroke="${colors[name]}" stroke-width="2"/>`;
      s+=`<text x="${X(idx)}" y="${Y(v)-9}" text-anchor="middle" font-size="10.5" fill="${name==='COE認定'?'#e11d2a':(name==='審査完了'?'#9aa1a9':'#111418')}" font-weight="700">${v}</text>`;
    });
  });
  g("trendChart").innerHTML=s;
  g("trendTitle").textContent = TAB==="week" ? "処理量トレンド（直近6週）" : "処理量トレンド（直近6ヶ月）";
}

/* ---------- リードタイム（登録→申請）live ---------- */
async function renderLead(cur){
  const t=g("leadTable"), note=g("leadNote");
  const src=TAB==="week"?"week":"month";
  const data=SNAP[src][cur];
  const from=data.from, to=data.to;
  t.innerHTML=`<thead><tr><th class="l">種別</th><th>件数</th><th>平均</th><th>中央値</th></tr></thead>
    <tbody><tr><td class="l" colspan="4"><span class="small">読み込み中…</span></td></tr></tbody>`;
  let rows;
  try{ rows=await loadCases(); }
  catch(e){ t.querySelector("tbody").innerHTML=`<tr><td class="l" colspan="4"><span class="err small">casesを取得できませんでした（${e.message}）</span></td></tr>`; return; }
  const inRange=s=>{const m=String(s||"").slice(0,10);return /^\d{4}-\d{2}-\d{2}$/.test(m)&&m>=from&&m<=to;};
  const body=TYPES.map(tp=>{
    const set=rows.filter(r=>r.app_type===tp&&inRange(r.receipt_date));
    const days=set.map(r=>{
      const rd=new Date(String(r.receipt_date).slice(0,10));
      const cr=new Date(String(r.created_at).slice(0,10));
      return Math.round((rd-cr)/86400000);
    }).filter(d=>d>=0&&d<400);
    const avg=days.length?round(days.reduce((a,b)=>a+b,0)/days.length):null;
    const med=median(days);
    return `<tr><td class="l lab">${tp}</td><td>${nf(set.length)}</td>
      <td>${avg==null?"—":avg+"日"}</td><td>${med==null?"—":med+"日"}</td></tr>`;
  }).join("");
  t.innerHTML=`<thead><tr><th class="l">種別</th><th>件数</th><th>平均</th><th>中央値</th></tr></thead><tbody>${body}</tbody>`;
  note.textContent="※ 登録日＝レコード作成日、申請日＝申請受付日として cases から算出（参考値）。";
}

/* ---------- 分析と対策 ---------- */
const isDone=r=>r.status==="完了";
const hasTsuikan=r=>r.status&&r.status.indexOf("追完")>=0;
const isShinsaSt=r=>r.status&&r.status.indexOf("審査中")>=0;
function dparse(s){const m=String(s||"").slice(0,10);return /^\d{4}-\d{2}-\d{2}$/.test(m)?new Date(m):null;}
function cell(v){return v>0?`<td class="hot">${nf(v)}</td>`:`<td>${nf(v)}</td>`;}

async function renderAnalysis(){
  document.querySelectorAll("#subTabs button").forEach(b=>b.classList.toggle("on",b.dataset.sub===SUB));
  const body=g("anBody");
  body.innerHTML=`<div class="card"><div class="state"><div class="spin"></div>集計中…</div></div>`;
  let rows;
  try{rows=await loadCases();}catch(e){body.innerHTML=`<div class="card err">casesを取得できませんでした（${e.message}）</div>`;return;}
  if(SUB==="system")renderAnSystem(rows,body); else renderAnStaff(rows,body);
}

function renderAnSystem(rows,body){
  const today=new Date();today.setHours(0,0,0,0);
  const active=rows.filter(r=>!isDone(r));
  const stMap=new Map();active.forEach(r=>{const k=r.status||"(未設定)";stMap.set(k,(stMap.get(k)||0)+1);});
  const stTop=[...stMap.entries()].sort((a,b)=>b[1]-a[1]).slice(0,12);
  const expBetween=(lo,hi)=>rows.filter(r=>{if(isDone(r))return false;const d=dparse(r.expire);if(!d)return false;const dd=Math.round((d-today)/864e5);return dd>=lo&&dd<=hi;}).length;
  const expOver=rows.filter(r=>{if(isDone(r))return false;const d=dparse(r.expire);return d&&d<today;}).length;
  const exp7=expBetween(0,7), exp30=expBetween(0,30);
  const tsuikan=rows.filter(hasTsuikan).length;
  const stale=active.filter(r=>{const u=dparse(r.updated_at);return u&&Math.round((today-u)/864e5)>=30;}).length;
  const tsuTrend=MKEYS.slice(-6).map(k=>{const c=SNAP.month[k].counts;return {k,rate:c.申請?Math.round(c.追完/c.申請*100):0,n:c.申請};});
  const shTrend=SKEYS.slice(-6).map(k=>({k,avg:SNAP.shinsa[k].overall?.avg??null,med:SNAP.shinsa[k].overall?.med??null}));

  // 対策
  const lastM=MKEYS[MKEYS.length-1];
  const appT=SNAP.month[lastM]?.breakdown?.["申請"]?.byType||{};
  const tkT=SNAP.month[lastM]?.breakdown?.["追完"]?.byType||{};
  let worstType=null,worstRate=-1;
  TYPES.forEach(tp=>{const a=appT[tp]||0,k=tkT[tp]||0;if(a>=20){const r=Math.round(k/a*100);if(r>worstRate){worstRate=r;worstType=tp;}}});
  const acts=[];
  if(expOver>0)acts.push(`在留期限を<b>経過</b>した未完了案件が <b>${expOver}件</b>。申請中・特例期間かを至急確認し、未申請なら即対応。`);
  if(exp7>0)acts.push(`在留期限が<b>7日以内</b>の未完了案件が <b>${exp7}件</b>。最優先で申請状況／交付を確認。`);
  if(tsuikan>0)acts.push(`要追完ステータスの案件が <b>${tsuikan}件</b>。担当横断で追完対応を巻き取り。`);
  if(stale>0)acts.push(`30日以上更新の無い進行中案件が <b>${stale}件</b>。工程の停滞ボトルネックを点検。`);
  if(stTop[0])acts.push(`滞留最多ステータス「${stTop[0][0]}」が <b>${stTop[0][1]}件</b>。前工程の詰まり・担当偏りを確認。`);
  if(worstType&&worstRate>=40)acts.push(`「${worstType}」の追完発生率が <b>${worstRate}%</b>と高め。当該種別の書類精度チェックを強化。`);
  if(!acts.length)acts.push(`大きなリスクは検出されていません。期限・追完・停滞は引き続きモニタリング。`);

  body.innerHTML=`
  <div class="card">
    <p class="st">リスクサマリー（現時点）</p>
    <p class="subhead">未完了案件のうち、対応が必要な件数</p>
    <div class="kgrid" style="grid-template-columns:repeat(5,1fr)">
      <div class="k"><div class="kl">在留期限 経過</div><div class="kn" style="color:${expOver?'#e11d2a':'inherit'}">${nf(expOver)}</div></div>
      <div class="k"><div class="kl">在留期限 7日以内</div><div class="kn" style="color:${exp7?'#e11d2a':'inherit'}">${nf(exp7)}</div></div>
      <div class="k"><div class="kl">在留期限 30日以内</div><div class="kn">${nf(exp30)}</div></div>
      <div class="k"><div class="kl">要追完</div><div class="kn" style="color:${tsuikan?'#e11d2a':'inherit'}">${nf(tsuikan)}</div></div>
      <div class="k"><div class="kl">停滞（30日以上）</div><div class="kn" style="color:${stale?'#e11d2a':'inherit'}">${nf(stale)}</div></div>
    </div>
  </div>

  <div class="card">
    <p class="st">対策：システムとして手を打つべきこと</p>
    <ul class="acts">${acts.map(a=>`<li><span>${a}</span></li>`).join("")}</ul>
  </div>

  <div class="card">
    <p class="st">進行中ステータス別 滞留件数（完了除く・上位12）</p>
    <table class="grid"><thead><tr><th class="l">ステータス</th><th>件数</th></tr></thead>
    <tbody>${stTop.map(([s,n])=>`<tr><td class="l lab">${s}</td>${cell(n)}</tr>`).join("")}</tbody></table>
  </div>

  <div class="card">
    <p class="st">追完発生率の推移（月次・申請分母）</p>
    <table class="grid"><thead><tr><th class="l">月</th><th>申請</th><th>追完発生率</th></tr></thead>
    <tbody>${tsuTrend.map(t=>`<tr><td class="l lab">${t.k}</td><td>${nf(t.n)}</td><td class="pct">${t.rate}%</td></tr>`).join("")}</tbody></table>
  </div>

  <div class="card">
    <p class="st">審査期間（申請→審査完了）の推移</p>
    <table class="grid"><thead><tr><th class="l">月</th><th>平均</th><th>中央値</th></tr></thead>
    <tbody>${shTrend.map(t=>`<tr><td class="l lab">${t.k}</td><td>${t.avg==null?"—":t.avg+"日"}</td><td>${t.med==null?"—":t.med+"日"}</td></tr>`).join("")}</tbody></table>
  </div>`;
}

function renderAnStaff(rows,body){
  const today=new Date();today.setHours(0,0,0,0);
  const map=new Map();
  rows.forEach(r=>{
    const s=(r.staff&&r.staff.trim())||"(未割当)";
    if(!map.has(s))map.set(s,{staff:s,total:0,active:0,shinsa:0,tsuikan:0,exp30:0,exp7:0,stale:0});
    const o=map.get(s);o.total++;
    const done=isDone(r);
    if(!done)o.active++;
    if(isShinsaSt(r))o.shinsa++;
    if(hasTsuikan(r))o.tsuikan++;
    const d=dparse(r.expire);
    if(d&&!done){const dd=Math.round((d-today)/864e5);if(dd>=0&&dd<=30)o.exp30++;if(dd>=0&&dd<=7)o.exp7++;}
    const u=dparse(r.updated_at);
    if(u&&!done&&Math.round((today-u)/864e5)>=30)o.stale++;
  });
  const list=[...map.values()];
  list.forEach(o=>o.todo=o.tsuikan+o.exp7+o.stale);
  const byTotal=[...list].sort((a,b)=>b.total-a.total);
  const byTodo=list.filter(o=>o.todo>0).sort((a,b)=>b.todo-a.todo);

  const tableRows=byTotal.map(o=>`<tr>
    <td class="l lab">${o.staff}</td>
    <td>${nf(o.total)}</td><td>${nf(o.active)}</td><td>${nf(o.shinsa)}</td>
    ${cell(o.tsuikan)}${cell(o.exp7)}<td>${nf(o.exp30)}</td>${cell(o.stale)}</tr>`).join("");

  const actRows=byTodo.slice(0,15).map(o=>{
    const parts=[];
    if(o.tsuikan)parts.push(`要追完 ${o.tsuikan}`);
    if(o.exp7)parts.push(`期限7日以内 ${o.exp7}`);
    if(o.stale)parts.push(`停滞30日+ ${o.stale}`);
    return `<li><span><b>${o.staff}</b>：要対応 <b>${o.todo}件</b>（${parts.join("・")}）</span></li>`;
  }).join("");

  body.innerHTML=`
  <div class="card">
    <p class="st">対策：担当別 いま対応すべき案件</p>
    <p class="subhead">要対応＝要追完＋在留期限7日以内＋停滞30日以上（多い順）</p>
    <ul class="acts">${actRows||'<li><span>緊急の要対応はありません。</span></li>'}</ul>
  </div>

  <div class="card">
    <p class="st">担当別 分析（現時点）</p>
    <div style="overflow-x:auto">
    <table class="grid"><thead><tr>
      <th class="l">担当</th><th>総数</th><th>進行中</th><th>審査中</th><th>要追完</th><th>期限7日</th><th>期限30日</th><th>停滞30日+</th>
    </tr></thead><tbody>${tableRows}</tbody></table>
    </div>
    <p class="small" style="margin-top:8px">※ 赤字＝リスク項目（1件以上）。停滞＝完了以外で更新日から30日以上。</p>
  </div>`;
}

/* ---------- 起動 ---------- */
function setDefaults(){
  if(!SEL.month||!MKEYS.includes(SEL.month))SEL.month=MKEYS.includes(prevMonthKey())?prevMonthKey():MKEYS[MKEYS.length-1];
  if(!SEL.week||!WKEYS.includes(SEL.week))SEL.week=WKEYS[WKEYS.length-1];
  if(!SEL.shinsa||!SKEYS.includes(SEL.shinsa))SEL.shinsa=SKEYS.includes(prevMonthKey())?prevMonthKey():SKEYS[SKEYS.length-1];
}
function setStatus(){
  g("updated").textContent = "ver.20260820.T01　" + (DATA_MODE==="live"
    ? ("ライブ最新 "+new Date().toLocaleString("ja-JP"))
    : "埋め込みデータ表示（プレビュー／オフライン）— ホスティング先ではライブ更新されます");
}
async function boot(){
  g("error").classList.add("hidden");
  ingest(SNAP_BAKED);DATA_MODE="baked";setDefaults();
  g("loading").classList.add("hidden");g("app").classList.remove("hidden");
  applyTab();setStatus();
  try{CASES=null;await tryLiveSnapshots();setDefaults();applyTab();setStatus();}
  catch(e){DATA_MODE="baked";setStatus();}
}

/* ---------- events ---------- */
g("tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;TAB=b.dataset.tab;applyTab();});
g("periodPick").addEventListener("change",e=>{SEL[TAB]=e.target.value;renderPeriod();});
g("shinsaPick").addEventListener("change",e=>{SEL.shinsa=e.target.value;renderShinsa(SEL.shinsa);g("metaLabel").innerHTML=`対象: <b>${SEL.shinsa}</b> ／ 申請→審査完了`;});
g("subTabs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;SUB=b.dataset.sub;renderAnalysis();});
g("reloadBtn").addEventListener("click",boot);
g("printBtn").addEventListener("click",()=>window.print());
boot();
</script>
</body>
