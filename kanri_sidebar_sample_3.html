<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理部メニュー サイドバー サンプル</title>
<style>
  :root{--nav:#182338;--navHi:#25344c;--txt:#e5e7eb;--sub:#aab6c8;--muted:#5f6f85;--hd:#7c8aa0;
        --danger:#f87171;--warn:#fbbf77;--ok:#86c46a;}
  *{box-sizing:border-box;}
  body{margin:0;background:#f6f5f1;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;color:#242320;padding:24px;}
  .note{max-width:640px;margin:0 auto 16px;font-size:13px;color:#6b6960;line-height:1.7;}
  .stage{display:flex;justify-content:center;}
  .sidebar{width:260px;background:var(--nav);border-radius:12px;padding:10px 8px;color:var(--txt);align-self:flex-start;}
  .sechd{padding:6px 10px;font-size:11px;color:var(--hd);font-weight:700;letter-spacing:.5px;}
  .menu{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:8px;background:var(--navHi);color:#cfe0f5;font-size:13px;font-weight:600;margin-bottom:4px;cursor:pointer;}
  .cat{display:flex;align-items:center;padding:8px 10px;font-size:13px;color:var(--txt);cursor:pointer;border-radius:6px;user-select:none;}
  .cat:hover{background:rgba(255,255,255,.05);}
  .chev{color:var(--hd);font-size:11px;margin-right:7px;transition:transform .15s;display:inline-block;}
  .cat.closed .chev{transform:rotate(-90deg);}
  .badge{margin-left:auto;background:rgba(239,68,68,.16);color:var(--danger);font-size:11px;font-weight:700;padding:1px 8px;border-radius:9px;}
  .subs{padding:2px 10px 6px 26px;display:flex;flex-direction:column;gap:2px;overflow:hidden;}
  .subs.hide{display:none;}
  .sub{display:flex;font-size:12px;color:var(--sub);padding:4px 6px;border-radius:5px;cursor:pointer;}
  .sub:hover{background:rgba(255,255,255,.05);color:#e5e7eb;}
  .cnt{margin-left:auto;}
  .foot{margin-top:10px;padding:8px 10px;border-top:.5px solid rgba(255,255,255,.08);font-size:11px;color:var(--hd);min-height:16px;}
</style>
</head>
<body>
<div class="note">サンプル（ダミー件数）。普段はカテゴリを畳んだ状態。カテゴリ行を押すと開いてサブ項目が出ます（▾/▸）。「🏢 管理部メニュー」でダッシュボード全体、サブ項目でその項目へジャンプ（下部に選択内容を表示）。実装時はこの構造を index.html のサイドバーに組み込みます。</div>
<div class="stage">
  <div class="sidebar">
    <div class="sechd">🏢 管理部</div>
    <div class="menu" onclick="pick('管理部メニュー（ダッシュボード全体）')">🏢 管理部メニュー</div>
    <div id="tree"></div>
    <div class="foot" id="foot">選択：—</div>
  </div>
</div>
<script>
var cats = [
  {name:'期限アラート', total:31, subs:[
    ['在留期限切迫',14,'danger'],['特例期限',6,'warn'],['申請期限',null,''],
    ['一時帰国',3,'warn'],['★申請（2日以上）',8,'danger'],['表示停止申請',null,'']]},
  {name:'申請・審査・認定証', total:null, subs:[
    ['申請受付番号',null,''],['審査完了',0,'ok'],['認定証',null,''],
    ['案件依頼',null,''],['申請受付番号未入力',null,'']]},
  {name:'追完対応', total:184, subs:[
    ['要追完ステータス',93,'danger'],['ステータス矛盾',null,''],
    ['追完カード未対応',81,'danger'],['要追完/指摘 未確認',10,'warn']]},
  {name:'書類・不足', total:969, subs:[
    ['不足表示：必須対応',5,'danger'],['不足表示：随時対応',793,'warn'],
    ['必要書類不足（会社）',75,'warn'],['ドライブURL未入力',null,''],
    ['人材チェックリスト未入力',96,'warn']]},
  {name:'報告・対応', total:'1k+', subs:[
    ['未対応報告',null,''],['担当者コメント',1117,'warn'],
    ['エラー通知',2,'danger'],['変更依頼',0,'ok']]},
  {name:'放置・停滞', total:914, subs:[
    ['タスクアラート',81,'danger'],['停滞案件',807,'danger'],['★申請',26,'warn']]}
];
var colorMap={danger:'var(--danger)',warn:'var(--warn)',ok:'var(--ok)','':'var(--muted)'};
function pick(t){document.getElementById('foot').textContent='選択：'+t;}
function toggle(i){
  var s=document.getElementById('subs-'+i), c=document.getElementById('cat-'+i);
  s.classList.toggle('hide'); c.classList.toggle('closed');
}
(function(){
  var h='';
  cats.forEach(function(c,i){
    var badge = (c.total!==null && c.total!==undefined && c.total!==0) ? '<span class="badge">'+c.total+'</span>' : '';
    h+='<div class="cat closed" id="cat-'+i+'" onclick="toggle('+i+')"><span class="chev">▾</span>'+c.name+badge+'</div>';
    h+='<div class="subs hide" id="subs-'+i+'">';
    c.subs.forEach(function(s){
      var val = (s[1]===null||s[1]===undefined)?'—':s[1];
      h+='<div class="sub" onclick="event.stopPropagation();pick(\''+c.name+' ＞ '+s[0]+'\')">'+s[0]+'<span class="cnt" style="color:'+colorMap[s[2]]+'">'+val+'</span></div>';
    });
    h+='</div>';
  });
  document.getElementById('tree').innerHTML=h;
})();
</script>
</body>
</html>
