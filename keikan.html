function _skPerfCalc(year){

  h+='<div style="overflow:auto;"><table class="skp-tbl"><thead><tr><th class="l" style="padding-left:12px;">契約先</th><th>予定（月）</th>'+months.map(function(m,i){ return '<th'+(i===0?' class="dv"':'')+(m===nowYm?' style="color:#1d4ed8;"':'')+'>'+(+m.slice(5))+'月</th>'; }).join('')+'<th class="dv">達成（直近3か月）</th></tr></thead><tbody>';
  var rows=cl.map(function(l){ var on=orgName[l.support_org_id]||l.name, a=byOrg[on]||byOrg[String(l.name).trim()]||{}; return {l:l, a:a, tot:months.reduce(function(s,m){ return s+(a[m]||0); },0)}; }).sort(function(x,y){ return y.tot-x.tot; });
  rows.slice(0,60).forEach(function(r){ var plan=+r.l.hr_monthly_apps||0, l3=[months[2],months[3],months[4]].reduce(function(s,m){ return s+(r.a[m]||0); },0)/3, pc=plan?Math.round(l3/plan*100):null;
    h+='<tr class="st"><td class="l" style="padding-left:12px;font-weight:700;color:#0f172a;">'+esc(r.l.name)+(r.l.support_org_id?'':'<span class="skp-tag">機関ID未設定</span>')+'</td><td>'+(plan?n0(plan):'<span class="skp-z">未入力</span>')+'</td>'+months.map(function(m,i){ var v=r.a[m]||0; return '<td'+(i===0?' class="dv"':'')+'>'+(v||'<span class="skp-z">·</span>')+'</td>'; }).join('')+'<td class="dv">'+(pc==null?'<span class="skp-z">—</span>':'<span class="skp-pct '+(pc>=100?'ok':pc>=60?'lo':'hi')+'">'+pc+'%</span>')+'</td></tr>'; });
  h+='</tbody></table></div>';
  // 営シスに足りない機能
  h+='<div class="skrp-sec">営シスに足りないもの（経営企画とつなぐために）</div><div class="kk-card" style="font-size:12.5px;line-height:1.9;color:#334155;">'
    +'<b>1. 見込み先ごとの「いつから・月何件・いくら・確度」の入力</b>：入れる欄（月間申請・開始予定・確度・単価）はDBにあるが、画面で使われておらず入っているのは '+filled+'社／確度は '+withProb+'社。<br>'
    +'<b>2. 受注の登録と案シスの登録支援機関のひもづけ</b>：受注（eigyo_deals）は '+S.deals.length+'件だけ。確定 '+cl.length+'社のうち登録支援機関IDがあるのは '+cl.filter(function(l){ return l.support_org_id; }).length+'社。IDがないと予定と実績を比べられない。<br>'
    +'<b>3. 営業計画（月別の受注目標→申請件数→売上）</b>：KPI計画（年間売上目標 '+(S.plan?_skRpMan(+S.plan.target_revenue,0)+'万円':'未設定')+'・100社あたり申請数）はあるが、月ごとの「何社受注・何件増える・いくら」の計画と実績の表がない。<br>'
    +'<b>4. 活動の実績入力</b>：架電・商談・受注のKPI目標はあるが、日々の実績（eigyo_kpi_daily）が0件。<br>'
    +'<b>5. 既存先の増減（伸び・離反）</b>：確定先の申請が減った・止まった先を知らせる仕組みがない（上の表で3か月平均が予定を下回る先）。<br>'
    +'→ 1・2が入れば、この画面の期待値が自動でロードマップの上乗せになり、予定と実績を毎月追えます。</div>';
  return h;
}
function kkPushToRoadmap(){
  var S=KK.sales; if(!S) return; var R=_skRpCalc(_skPerf.year), p=_skRmOf(R), added=0;
  p.items=(p.items||[]).filter(function(it){ return it.src!=='eigyo'; });
  S.leads.filter(function(l){ return (l.status!=='確定' && l.status!=='取引中' && l.status!=='依頼待ち') && (l.hr_monthly_apps||l.hr_potential_apps); }).forEach(function(l){
    var m=+l.hr_monthly_apps||Math.round((+l.hr_potential_apps||0)/12), pr=(l.close_prob!=null&&l.close_prob!=='')?+l.close_prob:(l.status==='結果待ち'?50:20), ex=Math.round(m*pr/10)/10; if(!ex) return;
    var ym=String(l.hr_start_date||'').slice(0,7); if(!/^\d{4}-\d{2}$/.test(ym) || ym<p.start) ym=p.start;
    p.items.push({name:l.name+'（営シス見込み）', ym:ym, n:ex, mode:'flat', kind:'認定・変更', price:null, end:'', src:'eigyo'}); added++; });
  showToast('🗺 '+added+'件をロードマップに入れました'); _skRmSave(p);
}
// ===== ログイン =====
var _sbSession=null;
async function kkLogin(){
  var e=document.getElementById('lgEmail').value.trim(), p=document.getElementById('lgPass').value, er=document.getElementById('lgErr');
  er.textContent=''; var r=await _sb.auth.signInWithPassword({email:e, password:p});
  if(r.error||!r.data||!r.data.session){ er.textContent='ログインできませんでした：'+(r.error?r.error.message:''); return; }
  document.getElementById('lgBox').style.display='none'; kkRender();
}
async function kkInit(){
  try{ KK.page=localStorage.getItem('kk_page')||'home'; }catch(e){}
  document.querySelectorAll('.kk-nav a[data-p]').forEach(function(a){ a.classList.toggle('on', a.getAttribute('data-p')===KK.page); });
  var s=await _sb.auth.getSession();
  if(!(s&&s.data&&s.data.session)){ document.getElementById('lgBox').style.display='flex'; return; }
  document.getElementById('kkUser').textContent=currentUser||'（名前未設定）';
  kkRender();
}

kkInit();
</script>
