<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>スガシス｜菅沼顧問システム</title>
<style>
:root{
  --navy:#0f2040; --blue:#2563eb; --blue-light:#eff6ff;
  --green:#16a34a; --orange:#ea580c; --red:#dc2626;
  --gray-100:#f1f5f9; --gray-200:#e2e8f0; --gray-400:#94a3b8; --gray-700:#334155;
  --white:#ffffff; --shadow:0 2px 12px rgba(0,0,0,0.08);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--gray-100);color:var(--navy);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif;font-size:14px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
[hidden]{display:none!important}

/* 入口（アンシスのログイン画面に合わせる） */
.gate{min-height:100%;display:grid;place-items:center;padding:24px;background:var(--navy)}
.gate form{width:320px;max-width:90vw;background:var(--white);border-radius:20px;padding:36px 32px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.gate h1{font-size:22px;font-weight:900;margin:0 0 4px}
.gate p{font-size:12px;color:var(--gray-400);margin:0 0 28px}
.gate label{display:block;font-size:11px;font-weight:700;color:var(--gray-400);margin-bottom:4px}
.gate input{width:100%;padding:10px 12px;border:1.5px solid var(--gray-200);border-radius:8px;font-size:16px;outline:none}
.gate input:focus{border-color:var(--blue)}
.gate .err{color:var(--red);min-height:1.6em;margin:8px 0 0;font-size:12px}
.gate .btn{width:100%;justify-content:center;padding:12px;background:var(--navy);border-radius:10px;font-size:14px;font-weight:800;margin-top:8px}
.gate .btn:hover{background:#1e3a5f}

.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none;background:var(--blue);color:#fff;transition:.15s}
.btn:hover{background:#1d4ed8}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:#fff;border:1.5px solid var(--gray-200);color:var(--navy)}
.btn.ghost:hover{border-color:var(--blue);color:var(--blue);background:#fff}

/* 全体（アンシスと同じ左サイドバー構成） */
.app{display:grid;grid-template-columns:220px minmax(0,1fr);height:100%}
.sidebar{background:var(--navy);display:flex;flex-direction:column;overflow-y:auto;min-height:0}
.sidebar-logo{padding:20px 16px 16px}
.logo-badge{background:var(--blue);color:#fff;font-size:11px;font-weight:800;padding:3px 8px;border-radius:4px;display:inline-block;margin-bottom:6px;letter-spacing:1px}
.logo-title{color:#fff;font-size:12px;font-weight:700;line-height:1.4}
.ver{font-size:10px;color:#475569;margin-top:2px}
.sidebar-section{padding:8px 12px 4px;font-size:10px;color:#475569;font-weight:700;letter-spacing:1px}
.tabs{display:flex;flex-direction:column}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 16px;color:var(--gray-400);font-size:13px;cursor:pointer;border-radius:6px;margin:1px 8px;background:none;border:0;text-align:left}
.nav-item:hover,.nav-item[aria-selected="true"]{background:rgba(255,255,255,.1);color:#fff}
.sidebar-user{padding:12px 16px;border-top:1px solid rgba(255,255,255,.08);margin-top:auto}
.user-info{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.user-avatar{width:32px;height:32px;border-radius:50%;background:var(--blue);display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:700}
.user-name{color:#fff;font-size:12px;font-weight:600}
.user-role{color:var(--gray-400);font-size:10px}
.side-btn{display:block;width:100%;text-align:left;background:none;border:0;color:var(--gray-400);font-size:12px;padding:6px 8px;border-radius:6px;cursor:pointer}
.side-btn:hover{background:rgba(255,255,255,.1);color:#fff}
.sidebar :focus-visible{outline-color:#fff}
.main{display:grid;grid-template-rows:auto minmax(0,1fr);min-width:0;min-height:0}
.topbar{background:var(--white);border-bottom:1px solid var(--gray-200);padding:14px 24px;display:flex;align-items:baseline;gap:12px}
.page-title{font-size:18px;font-weight:800}
.topbar .cnt{font-size:12px;color:var(--gray-400);font-weight:600}
.body{display:grid;grid-template-columns:340px 1fr;min-height:0}

/* 一覧 */
.list{border-right:1px solid var(--gray-200);background:var(--white);display:flex;flex-direction:column;min-height:0}
.filters{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;border-bottom:1px solid var(--gray-200);background:#f8fafc}
.chip{border:1px solid var(--gray-200);background:#fff;border-radius:20px;padding:3px 10px;font-size:12px;font-weight:600;cursor:pointer;color:var(--gray-700)}
.chip:hover{border-color:var(--blue)}
.chip[aria-pressed="true"]{background:var(--blue-light);color:var(--blue);border-color:var(--blue)}
.search{display:flex;flex-wrap:wrap;gap:6px;width:100%}
.search input{flex:1 1 150px;min-width:0}
.search input,.search select{padding:6px 10px;border:1px solid var(--gray-200);border-radius:6px;background:#fff;font-size:13px}
.search input:focus,.search select:focus{outline:none;border-color:var(--blue)}
.search .btn{padding:6px 14px}
.rows{overflow:auto;flex:1}
.row{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--gray-200);border-left:3px solid transparent;padding:10px 14px 10px 11px;cursor:pointer;transition:.1s}
.row:hover{background:var(--blue-light)}
.row[aria-current="true"]{background:var(--blue-light);border-left-color:var(--blue)}
.row .nm{font-weight:700;font-size:13.5px;display:block;line-height:1.4}
.row .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:5px;font-size:12px;color:var(--gray-400)}
.st{display:inline-flex;align-items:center;border-radius:20px;padding:2px 9px;font-size:11px;font-weight:600;background:var(--gray-100);color:var(--gray-700);border:1px solid var(--gray-200)}
.st.s-da,.st.s-sho{background:#fff7ed;color:var(--orange);border-color:#fed7aa}
.st.s-zumi{background:var(--blue-light);color:var(--blue);border-color:#bfdbfe}
.st.s-sei{background:#f0fdf4;color:var(--green);border-color:#bbf7d0}
.st.s-mi{background:#fef2f2;color:var(--red);border-color:#fecaca}
.tori{display:inline-flex;align-items:center;border-radius:20px;padding:2px 9px;font-size:11px;font-weight:700;background:#f0fdf4;color:var(--green);border:1px solid #bbf7d0;white-space:nowrap}
h2 .tori{font-size:12px;vertical-align:middle;margin-left:8px}
.more{display:block;width:100%;padding:12px;background:none;border:0;color:var(--blue);font-weight:600;font-size:13px;cursor:pointer}
.empty{padding:28px 16px;color:var(--gray-400);font-size:13px}

/* 詳細 */
.detail{overflow:auto;padding:20px 24px 60px;min-width:0}
.detail h2{font-size:18px;font-weight:800;margin:0 0 2px;line-height:1.4}
.detail .loc{color:var(--gray-700);margin:0 0 16px;font-size:12.5px}
.detail .loc a{color:var(--blue)}
.back{display:none;background:none;border:0;color:var(--blue);padding:0;margin-bottom:10px;cursor:pointer;font-weight:600;font-size:13px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.cols.one{grid-template-columns:minmax(0,640px)}
.panel{background:var(--white);border:1px solid var(--gray-200);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow)}
.panel.mine{border-top:3px solid var(--blue)}
.panel h3{margin:0 0 2px;font-size:14px;font-weight:800}
.panel .note{margin:0 0 14px;color:var(--gray-400);font-size:12px}
dl{margin:0;display:grid;grid-template-columns:9em 1fr;gap:7px 12px;font-size:13px}
dt{color:var(--gray-400);font-weight:600;font-size:12px;padding-top:1px}
dd{margin:0;word-break:break-word}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:11px;font-weight:700;color:var(--gray-400);margin-bottom:4px}
.fld input,.fld select,.fld textarea{width:100%;padding:8px 10px;border:1.5px solid var(--gray-200);border-radius:8px;background:#fff;font-size:14px}
.fld input:focus,.fld select:focus,.fld textarea:focus,.cmform textarea:focus{outline:none;border-color:var(--blue)}
.fld textarea{min-height:92px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.saveline{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.saveline span{font-size:12px;color:var(--gray-400)}
.saveline span.ok{color:var(--green)} .saveline span.ng{color:var(--red)}
.thread{margin-top:20px;padding-top:16px;border-top:1px solid var(--gray-200)}
.cm{border-bottom:1px solid var(--gray-200);padding:9px 0}
.cm time{font-size:11px;color:var(--gray-400);font-weight:600}
.cm p{margin:2px 0 0;font-size:13px;white-space:pre-wrap;word-break:break-word}
.cmform{display:flex;gap:10px;align-items:flex-end;margin-top:10px}
.cmform textarea{flex:1;min-height:44px;padding:8px 10px;border:1.5px solid var(--gray-200);border-radius:8px;resize:vertical;font-size:14px}

@media (max-width:860px){
  .app{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  .sidebar{flex-direction:row;flex-wrap:wrap;align-items:center;gap:4px 8px;padding:8px 12px;overflow:visible}
  .sidebar-logo{padding:0;display:flex;align-items:center;gap:8px}
  .logo-badge{margin:0}
  .logo-title,.sidebar-section,.user-info{display:none}
  .tabs{flex-direction:row}
  .nav-item{margin:0;padding:7px 10px;gap:6px}
  .sidebar-user{display:flex;margin:0 0 0 auto;padding:0;border:0}
  .side-btn{width:auto}
  .topbar{padding:10px 14px}
  .body{grid-template-columns:1fr}
  .list{border-right:0}
  .app.viewing .list{display:none}
  .app:not(.viewing) .detail{display:none}
  .detail{padding:14px 14px 60px}
  .back{display:inline-block}
  .cols,.cols.one{grid-template-columns:1fr}
  .panel.mine{order:-1}
  input,select,textarea{font-size:16px!important}
}
</style>
</head>
<body>

<div class="gate" id="gate">
  <form id="gateForm" autocomplete="off">
    <h1>スガシス</h1>
    <p>菅沼顧問システム</p>
    <label for="pw">パスワード</label>
    <input id="pw" type="password" required autofocus>
    <div class="err" id="gateErr" role="alert"></div>
    <button class="btn" id="gateBtn">案件を開く</button>
  </form>
</div>

<div class="app" id="app" hidden>
  <aside class="sidebar">
    <div class="sidebar-logo">
      <span class="logo-badge">スガシス</span>
      <div class="logo-title">菅沼顧問システム</div>
      <div class="ver">ver.20261004.05</div>
    </div>
    <div class="sidebar-section">メニュー</div>
    <div class="tabs" role="tablist">
      <button type="button" class="tab nav-item" role="tab" data-m="suga" aria-selected="true"><span aria-hidden="true">🎯</span>菅沼案件</button>
      <button type="button" class="tab nav-item" role="tab" data-m="other" aria-selected="false"><span aria-hidden="true">🏢</span>その他の会社</button>
    </div>
    <div class="sidebar-user">
      <div class="user-info"><div class="user-avatar" aria-hidden="true">菅</div><div><div class="user-name">菅沼 顧問</div><div class="user-role">顧問</div></div></div>
      <button type="button" class="side-btn" id="reload">最新の内容にする</button>
      <button type="button" class="side-btn" id="logout">ログアウト</button>
    </div>
  </aside>
  <div class="main">
  <div class="topbar"><span class="page-title" id="pageTitle">菅沼案件</span><span class="cnt" id="cnt"></span></div>
  <div class="body">
    <nav class="list" aria-label="会社の一覧">
      <div class="filters" id="filters"></div>
      <div class="rows" id="rows"></div>
    </nav>
    <main class="detail" id="detail"></main>
  </div>
  </div>
</div>

<script>
const SB_URL = 'https://ehwlgbwpycglmopiqyty.supabase.co';
const SB_KEY = 'sb_publishable_3ptyILIpGIcNA5sUBhFMbA_n0VxpY2u';
const STATUSES = ['未着手','打診中','紹介済み','商談調整中','成約','見送り'];
const ST_CLASS = {'打診中':'s-da','商談調整中':'s-sho','紹介済み':'s-zumi','成約':'s-sei','見送り':'s-mi'};
const KAKUDO = ['高','中','低'];

const TORI = '<span class="tori">取引中</span>';
const OTHER_ST = ['未接触を除く','すべて','取引中のみ','接触済み','商談予定','商談済み→依頼待ち','契約中','要経過観察','見込みなし','対象外','未接触'];
let pw = '', leads = [], filter = 'すべて', currentId = null;
let mode = 'suga', others = [], oTotal = 0, oQ = '', oSt = '未接触を除く';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtD = d => d ? String(d).slice(0,10).replace(/-/g,'/') : '';
const fmtDT = d => { if(!d) return ''; const t = new Date(d); const p = n => String(n).padStart(2,'0');
  return `${t.getFullYear()}/${p(t.getMonth()+1)}/${p(t.getDate())} ${p(t.getHours())}:${p(t.getMinutes())}`; };
const sugaSt = l => (l.suga && l.suga.status) || '未着手';

async function rpc(fn, args){
  const res = await fetch(`${SB_URL}/rest/v1/rpc/${fn}`, {
    method:'POST',
    headers:{'Content-Type':'application/json', apikey:SB_KEY, Authorization:`Bearer ${SB_KEY}`},
    body: JSON.stringify(args)
  });
  if(!res.ok){
    let msg = ''; try{ msg = (await res.json()).message || ''; }catch(e){}
    const err = new Error(msg || `HTTP ${res.status}`); err.auth = msg.includes('SUGA_AUTH'); throw err;
  }
  return res.json();
}

async function load(){
  leads = await rpc('suga_list', {p_pw: pw});
  if(mode === 'other'){ await searchOther(false); return; }
  renderList();
  if(currentId && leads.some(l => l.reg_no === currentId)) renderDetail(); else { currentId = null; renderDetail(); }
}

$('gateForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('gateBtn'); btn.disabled = true; $('gateErr').textContent = '';
  pw = $('pw').value;
  try{
    await load();
    try{ sessionStorage.setItem('suga_pw', pw); }catch(e){}
    $('gate').hidden = true; $('app').hidden = false;
  }catch(err){
    pw = '';
    $('gateErr').textContent = err.auth ? 'パスワードが違います。もう一度入力してください。'
      : '読み込めませんでした。通信状況を確認して、もう一度お試しください。';
  }
  btn.disabled = false;
});

$('logout').addEventListener('click', () => {
  try{ sessionStorage.removeItem('suga_pw'); }catch(e){}
  pw = ''; leads = []; others = []; oTotal = 0; oQ = ''; oSt = '未接触を除く'; setMode('suga'); $('pw').value = '';
  $('app').hidden = true; $('gate').hidden = false; $('pw').focus();
});
$('reload').addEventListener('click', async () => {
  try{ await load(); }catch(err){ alert('読み込めませんでした。もう一度お試しください。'); }
});

function setMode(m){
  mode = m; currentId = null;
  $('pageTitle').textContent = m === 'other' ? 'その他の会社' : '菅沼案件';
  if(m === 'other') $('cnt').textContent = '';
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', String(t.dataset.m === m)));
  if(m === 'other'){
    $('filters').innerHTML = `<form class="search" id="oForm">
      <input id="oQ" type="search" placeholder="会社名・地域で探す" aria-label="会社名・地域で探す" value="${esc(oQ)}">
      <select id="oSt" aria-label="大房側のステータス">${OTHER_ST.map(x=>`<option${x===oSt?' selected':''}>${esc(x)}</option>`).join('')}</select>
      <button class="btn">探す</button></form>`;
    $('oForm').addEventListener('submit', e => { e.preventDefault(); oQ = $('oQ').value.trim(); oSt = $('oSt').value; currentId = null; renderDetail(); searchOther(false); });
    if(others.length) renderOther(); else if(pw) searchOther(false);
  } else renderList();
  renderDetail();
}
document.querySelector('.tabs').addEventListener('click', e => {
  const t = e.target.closest('.tab'); if(t && t.dataset.m !== mode) setMode(t.dataset.m);
});
async function searchOther(more){
  if(!more){ others = []; $('rows').innerHTML = '<div class="empty">探しています</div>'; }
  try{
    const st = oSt === '未接触を除く' ? '__active' : oSt === '取引中のみ' ? '__torihiki' : (oSt === 'すべて' ? '' : oSt);
    const r = await rpc('suga_search', {p_pw: pw, p_q: oQ, p_status: st, p_offset: others.length});
    if(mode !== 'other') return;
    others = others.concat(r.rows); oTotal = r.total; renderOther();
  }catch(err){
    if(mode === 'other') $('rows').innerHTML = '<div class="empty">読み込めませんでした。もう一度「探す」を押してください。</div>';
  }
}
function renderOther(){
  $('cnt').textContent = `${Number(oTotal).toLocaleString()}件`;
  const rest = oTotal - others.length;
  $('rows').innerHTML = others.length ? others.map(l =>
    `<button type="button" class="row" data-id="${esc(l.reg_no)}" aria-current="${l.reg_no===currentId}">
      <span class="nm">${esc(l.name)}</span>
      <span class="meta"><span class="st">${esc(l.status || '未設定')}</span>${l.torihiki?TORI:''}${l.pref?`<span>${esc(l.pref)}</span>`:''}</span></button>`
    ).join('') + (rest > 0 ? `<button type="button" class="more" id="more">続きを表示する（残り${rest.toLocaleString()}件）</button>` : '')
    : '<div class="empty">条件に合う会社はありません。言葉を変えて探してください。</div>';
}

function renderList(){
  if(mode === 'other'){ renderOther(); return; }
  $('cnt').textContent = `${leads.length}件`;
  const counts = {}; leads.forEach(l => { const s = sugaSt(l); counts[s] = (counts[s]||0)+1; });
  $('filters').innerHTML = ['すべて', ...STATUSES].filter(s => s === 'すべて' || counts[s])
    .map(s => `<button type="button" class="chip" aria-pressed="${s===filter}" data-f="${esc(s)}">${esc(s)} ${s==='すべて'?leads.length:counts[s]}</button>`).join('');
  const shown = leads.filter(l => filter === 'すべて' || sugaSt(l) === filter);
  $('rows').innerHTML = shown.length ? shown.map(l => {
    const s = sugaSt(l), nd = l.suga && l.suga.next_action_date;
    return `<button type="button" class="row" data-id="${esc(l.reg_no)}" aria-current="${l.reg_no===currentId}">
      <span class="nm">${esc(l.name)}</span>
      <span class="meta"><span class="st ${ST_CLASS[s]||''}">${esc(s)}</span>${l.torihiki?TORI:''}
      ${l.pref?`<span>${esc(l.pref)}</span>`:''}${nd?`<span>次回 ${esc(fmtD(nd))}</span>`:''}</span></button>`;
  }).join('') : `<div class="empty">${leads.length ? 'この状況の案件はありません。' : '菅沼案件はまだ登録されていません。'}</div>`;
}
$('filters').addEventListener('click', e => {
  const b = e.target.closest('[data-f]'); if(!b) return;
  filter = b.dataset.f; renderList();
});
$('rows').addEventListener('click', e => {
  if(e.target.id === 'more'){ e.target.disabled = true; searchOther(true); return; }
  const b = e.target.closest('[data-id]'); if(!b) return;
  currentId = b.dataset.id; renderList(); renderDetail();
  $('app').classList.add('viewing'); $('detail').scrollTop = 0;
});

function row(dt, dd){ return `<dt>${esc(dt)}</dt><dd>${dd ? dd : '<span style="color:#94a3b8">未入力</span>'}</dd>`; }
function join(a, b){ return [a, b].filter(Boolean).map(esc).join('　'); }

function renderDetail(){
  const el = $('detail');
  const isSuga = mode === 'suga';
  const l = (isSuga ? leads : others).find(x => x.reg_no === currentId);
  if(!l){ $('app').classList.remove('viewing');
    el.innerHTML = `<div class="empty">左の一覧から会社を選ぶと、詳細が表示されます。</div>`; return; }
  const s = l.suga || {};
  const attacks = [l.attack100&&'アタックS', l.attack_nb&&'アタック中林', l.attack_km&&'アタック亀谷', l.attack_sg&&'菅沼案件'].filter(Boolean).join('、');
  const site = l.website && /^https?:\/\//i.test(l.website) ? `<a href="${esc(l.website)}" target="_blank" rel="noopener noreferrer">ホームページ</a>` : '';
  el.innerHTML = `
    <button type="button" class="back" id="back">一覧に戻る</button>
    <h2>${esc(l.name)}${l.torihiki?TORI:''}</h2>
    <p class="loc">${esc([l.pref,l.city,l.address].filter(Boolean).join(''))}${l.tel?`　電話 ${esc(l.tel)}`:''}${l.rep_name?`　代表 ${esc(l.rep_name)}`:''}${site?`　${site}`:''}</p>
    <div class="cols${isSuga ? '' : ' one'}">
      ${isSuga ? `<section class="panel mine">
        <h3>菅沼さんの管理</h3>
        <p class="note">ここの内容は大房側の営業管理とは別に保存されます。</p>
        <div class="two">
          <div class="fld"><label for="fSt">状況</label>
            <select id="fSt">${STATUSES.map(x=>`<option${x===(s.status||'未着手')?' selected':''}>${esc(x)}</option>`).join('')}</select></div>
          <div class="fld"><label for="fKk">確度</label>
            <select id="fKk"><option value="">未設定</option>${KAKUDO.map(x=>`<option${x===s.kakudo?' selected':''}>${esc(x)}</option>`).join('')}</select></div>
        </div>
        <div class="two">
          <div class="fld"><label for="fNa">次にやること</label><input id="fNa" maxlength="500" value="${esc(s.next_action)}"></div>
          <div class="fld"><label for="fNd">その予定日</label><input id="fNd" type="date" value="${esc(s.next_action_date||'')}"></div>
        </div>
        <div class="fld"><label for="fMemo">メモ</label><textarea id="fMemo" maxlength="5000">${esc(s.memo)}</textarea></div>
        <div class="saveline"><button type="button" class="btn" id="save">保存する</button>
          <span id="saveMsg">${s.updated_at?`最終保存 ${esc(fmtDT(s.updated_at))}`:''}</span></div>
        <div class="thread">
          <h3>コメント</h3>
          <div id="cms">${(l.comments||[]).map(cmHtml).join('') || '<p class="note" id="noCm">コメントはまだありません。</p>'}</div>
          <div class="cmform"><textarea id="cmBody" maxlength="2000" placeholder="大房側に伝えたいことを書く" aria-label="コメント"></textarea>
            <button type="button" class="btn ghost" id="cmAdd">コメントする</button></div>
        </div>
      </section>` : ''}
      <section class="panel">
        <h3>大房側の営業状況</h3>
        <p class="note">${isSuga ? '大房側で更新している内容です。ここでは変更できません。' : '菅沼案件ではない会社です。見るだけで、状況やコメントは書けません。'}</p>
        <dl>
          ${row('大房との取引', l.torihiki ? '取引中（案件のご依頼あり）' : 'なし')}
          ${row('ステータス', esc(l.status))}
          ${row('営業ランク', esc(l.lead_rank))}
          ${row('担当者', esc(l.staff))}
          ${row('支援者数', l.supporter_count!=null ? esc(l.supporter_count)+'人' : '')}
          ${row('想定支援者数', l.expected_supporter!=null ? esc(l.expected_supporter)+'人' : '')}
          ${row('アタックリスト', esc(attacks))}
          ${row('書類作成方法', esc(l.doc_method))}
          ${row('初回接触日', join(fmtD(l.first_contact_date), l.first_contact_kind))}
          ${row('商談予定日', join(fmtD(l.meeting_date), l.meeting_kind))}
          ${row('ネクストアクション', join(l.next_action_kind, l.next_action) + (l.next_action_date?`　${esc(fmtD(l.next_action_date))}`:''))}
          ${row('登録番号', esc(l.reg_no))}
        </dl>
      </section>
    </div>`;
  $('back').addEventListener('click', () => $('app').classList.remove('viewing'));
  if(isSuga){
    $('save').addEventListener('click', () => save(l));
    $('cmAdd').addEventListener('click', () => addComment(l));
  }
}
function cmHtml(c){ return `<div class="cm"><time>${esc(fmtDT(c.created_at))}　${esc(c.author)}</time><p>${esc(c.body)}</p></div>`; }

async function save(l){
  const btn = $('save'), msg = $('saveMsg'); btn.disabled = true; msg.className = ''; msg.textContent = '保存しています';
  try{
    l.suga = await rpc('suga_save', {p_pw: pw, p_reg_no: l.reg_no, p_status: $('fSt').value, p_kakudo: $('fKk').value,
      p_next_action: $('fNa').value, p_next_action_date: $('fNd').value || null, p_memo: $('fMemo').value});
    msg.className = 'ok'; msg.textContent = `保存しました（${fmtDT(l.suga.updated_at)}）`;
    renderList();
  }catch(err){
    msg.className = 'ng'; msg.textContent = err.auth ? 'パスワードが変更されました。ログアウトして入り直してください。'
      : '保存できませんでした。通信状況を確認して、もう一度「保存する」を押してください。';
  }
  btn.disabled = false;
}
async function addComment(l){
  const ta = $('cmBody'), body = ta.value.trim(); if(!body){ ta.focus(); return; }
  const btn = $('cmAdd'); btn.disabled = true;
  try{
    const c = await rpc('suga_comment_add', {p_pw: pw, p_reg_no: l.reg_no, p_body: body});
    (l.comments = l.comments || []).push(c);
    const no = $('noCm'); if(no) no.remove();
    $('cms').insertAdjacentHTML('beforeend', cmHtml(c)); ta.value = '';
  }catch(err){ alert('コメントできませんでした。通信状況を確認して、もう一度お試しください。'); }
  btn.disabled = false;
}

// 同じタブを開いている間は入力し直さずに済むようにする
(async () => {
  let saved = ''; try{ saved = sessionStorage.getItem('suga_pw') || ''; }catch(e){}
  if(!saved) return;
  pw = saved;
  try{ await load(); $('gate').hidden = true; $('app').hidden = false; }
  catch(e){ pw = ''; try{ sessionStorage.removeItem('suga_pw'); }catch(_){} }
})();
</script>
</body>
</html>
