<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>スガシス｜菅沼顧問システム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1c2826; --sub:#5d6b68; --line:#d9e0dc; --paper:#f6f8f6; --card:#ffffff;
  --matsu:#2c6a4f; --matsu-soft:#e4efe9; --kohaku:#b7791f; --kohaku-soft:#fbf1dc;
  --beni:#a8433a; --hai:#eef1ef;
  --sans:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  --mincho:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.65}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--matsu);outline-offset:2px}
[hidden]{display:none!important}

/* 入口 */
.gate{min-height:100%;display:grid;place-items:center;padding:24px}
.gate form{width:min(380px,100%)}
.gate h1{font-family:var(--mincho);font-size:40px;letter-spacing:.08em;margin:0;line-height:1.2}
.gate p{color:var(--sub);margin:6px 0 28px}
.gate label{display:block;font-weight:500;margin-bottom:6px}
.gate input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:6px;background:var(--card);font-size:16px}
.gate .err{color:var(--beni);min-height:1.65em;margin:8px 0 0;font-size:14px}

.btn{border:0;border-radius:6px;background:var(--matsu);color:#fff;padding:11px 20px;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:transparent;color:var(--matsu);border:1px solid var(--matsu)}
.gate .btn{width:100%;margin-top:14px}

/* 全体 */
.app{display:grid;grid-template-rows:auto 1fr;height:100%}
.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--card)}
.top .brand{font-family:var(--mincho);font-size:22px;letter-spacing:.08em}
.top .cnt{color:var(--sub);font-size:13px}
.top .sp{flex:1}
.top button{background:none;border:0;color:var(--sub);cursor:pointer;font-size:13px;text-decoration:underline}
.top .tab{font-size:15px;font-weight:500;text-decoration:none;border-bottom:3px solid transparent;padding:4px 8px}
.top .tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--matsu)}
.tabs{display:flex;gap:4px}
.search{display:flex;flex-wrap:wrap;gap:6px;width:100%}
.search input{flex:1 1 150px;min-width:0}
.search input,.search select{padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:#fff}
.search .btn{padding:7px 14px}
.more{display:block;width:100%;padding:14px;background:none;border:0;color:var(--matsu);font-weight:500;cursor:pointer}
.cols.one{grid-template-columns:minmax(0,640px)}
.body{display:grid;grid-template-columns:340px 1fr;min-height:0}

/* 一覧 */
.list{border-right:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;min-height:0}
.filters{display:flex;flex-wrap:wrap;gap:6px;padding:12px 14px;border-bottom:1px solid var(--line)}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 11px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.rows{overflow:auto;flex:1}
.row{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);border-left:4px solid transparent;padding:12px 14px 12px 12px;cursor:pointer}
.row:hover{background:var(--paper)}
.row[aria-current="true"]{background:var(--matsu-soft);border-left-color:var(--matsu)}
.row .nm{font-weight:700;display:block;line-height:1.4}
.row .meta{display:flex;gap:8px;align-items:center;margin-top:5px;font-size:12.5px;color:var(--sub)}
.st{display:inline-block;border-radius:4px;padding:1px 8px;font-size:12.5px;font-weight:500;background:var(--hai);color:var(--sub)}
.st.s-da,.st.s-sho{background:var(--kohaku-soft);color:var(--kohaku)}
.st.s-zumi,.st.s-sei{background:var(--matsu-soft);color:var(--matsu)}
.st.s-mi{background:#f6e3e1;color:var(--beni)}
.empty{padding:28px 16px;color:var(--sub)}

/* 詳細 */
.detail{overflow:auto;padding:24px 28px 60px;min-width:0}
.detail h2{font-family:var(--mincho);font-size:26px;margin:0 0 2px;line-height:1.35}
.detail .loc{color:var(--sub);margin:0 0 20px;font-size:14px}
.detail .loc a{color:var(--matsu)}
.back{display:none;background:none;border:0;color:var(--matsu);padding:0;margin-bottom:10px;cursor:pointer;font-weight:500}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.panel{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:18px 20px}
.panel.mine{border-color:var(--matsu);border-width:2px}
.panel h3{margin:0 0 4px;font-size:16px}
.panel .note{margin:0 0 14px;color:var(--sub);font-size:13px}
dl{margin:0;display:grid;grid-template-columns:8.5em 1fr;gap:7px 12px;font-size:14px}
dt{color:var(--sub)}
dd{margin:0;word-break:break-word}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:13px;font-weight:500;margin-bottom:4px}
.fld input,.fld select,.fld textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:6px;background:#fff}
.fld textarea{min-height:92px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.saveline{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.saveline span{font-size:13px;color:var(--sub)}
.saveline span.ok{color:var(--matsu)} .saveline span.ng{color:var(--beni)}
.thread{margin-top:20px}
.cm{border-top:1px solid var(--line);padding:10px 0}
.cm time{font-size:12.5px;color:var(--sub)}
.cm p{margin:2px 0 0;white-space:pre-wrap;word-break:break-word}
.cmform{display:flex;gap:10px;align-items:flex-end;margin-top:8px}
.cmform textarea{flex:1;min-height:46px;padding:9px 11px;border:1px solid var(--line);border-radius:6px;resize:vertical}
.ver{position:fixed;right:8px;bottom:4px;font-size:11px;color:#9aa5a1}

@media (max-width:860px){
  .body{grid-template-columns:1fr}
  .list{border-right:0}
  .app.viewing .list{display:none}
  .app:not(.viewing) .detail{display:none}
  .detail{padding:16px 16px 60px}
  .back{display:inline-block}
  .cols,.cols.one{grid-template-columns:1fr}
  .panel.mine{order:-1}
  .detail h2{font-size:22px}
}
</style>
</head>
<body>

<div class="gate" id="gate">
  <form id="gateForm" autocomplete="off">
    <h1>スガシス</h1>
    <p>菅沼顧問システム</p>
    <label for="pw">パスワード</label>
    <input id="pw" type="password" required autofocus>
    <div class="err" id="gateErr" role="alert"></div>
    <button class="btn" id="gateBtn">案件を開く</button>
  </form>
</div>

<div class="app" id="app" hidden>
  <header class="top">
    <span class="brand">スガシス</span>
    <div class="tabs" role="tablist">
      <button type="button" class="tab" role="tab" data-m="suga" aria-selected="true">菅沼案件</button>
      <button type="button" class="tab" role="tab" data-m="other" aria-selected="false">その他の会社</button>
    </div>
    <span class="cnt" id="cnt"></span>
    <span class="sp"></span>
    <button type="button" id="reload">最新の内容にする</button>
    <button type="button" id="logout">ログアウト</button>
  </header>
  <div class="body">
    <nav class="list" aria-label="会社の一覧">
      <div class="filters" id="filters"></div>
      <div class="rows" id="rows"></div>
    </nav>
    <main class="detail" id="detail"></main>
  </div>
</div>
<div class="ver">ver.20261004.02</div>

<script>
const SB_URL = 'https://ehwlgbwpycglmopiqyty.supabase.co';
const SB_KEY = 'sb_publishable_3ptyILIpGIcNA5sUBhFMbA_n0VxpY2u';
const STATUSES = ['未着手','打診中','紹介済み','商談調整中','成約','見送り'];
const ST_CLASS = {'打診中':'s-da','商談調整中':'s-sho','紹介済み':'s-zumi','成約':'s-sei','見送り':'s-mi'};
const KAKUDO = ['高','中','低'];

const OTHER_ST = ['未接触を除く','すべて','接触済み','商談予定','商談済み→依頼待ち','契約中','要経過観察','見込みなし','対象外','未接触'];
let pw = '', leads = [], filter = 'すべて', currentId = null;
let mode = 'suga', others = [], oTotal = 0, oQ = '', oSt = '未接触を除く';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtD = d => d ? String(d).slice(0,10).replace(/-/g,'/') : '';
const fmtDT = d => { if(!d) return ''; const t = new Date(d); const p = n => String(n).padStart(2,'0');
  return `${t.getFullYear()}/${p(t.getMonth()+1)}/${p(t.getDate())} ${p(t.getHours())}:${p(t.getMinutes())}`; };
const sugaSt = l => (l.suga && l.suga.status) || '未着手';

async function rpc(fn, args){
  const res = await fetch(`${SB_URL}/rest/v1/rpc/${fn}`, {
    method:'POST',
    headers:{'Content-Type':'application/json', apikey:SB_KEY, Authorization:`Bearer ${SB_KEY}`},
    body: JSON.stringify(args)
  });
  if(!res.ok){
    let msg = ''; try{ msg = (await res.json()).message || ''; }catch(e){}
    const err = new Error(msg || `HTTP ${res.status}`); err.auth = msg.includes('SUGA_AUTH'); throw err;
  }
  return res.json();
}

async function load(){
  leads = await rpc('suga_list', {p_pw: pw});
  if(mode === 'other'){ await searchOther(false); return; }
  renderList();
  if(currentId && leads.some(l => l.reg_no === currentId)) renderDetail(); else { currentId = null; renderDetail(); }
}

$('gateForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('gateBtn'); btn.disabled = true; $('gateErr').textContent = '';
  pw = $('pw').value;
  try{
    await load();
    try{ sessionStorage.setItem('suga_pw', pw); }catch(e){}
    $('gate').hidden = true; $('app').hidden = false;
  }catch(err){
    pw = '';
    $('gateErr').textContent = err.auth ? 'パスワードが違います。もう一度入力してください。'
      : '読み込めませんでした。通信状況を確認して、もう一度お試しください。';
  }
  btn.disabled = false;
});

$('logout').addEventListener('click', () => {
  try{ sessionStorage.removeItem('suga_pw'); }catch(e){}
  pw = ''; leads = []; others = []; oTotal = 0; oQ = ''; oSt = '未接触を除く'; setMode('suga'); $('pw').value = '';
  $('app').hidden = true; $('gate').hidden = false; $('pw').focus();
});
$('reload').addEventListener('click', async () => {
  try{ await load(); }catch(err){ alert('読み込めませんでした。もう一度お試しください。'); }
});

function setMode(m){
  mode = m; currentId = null;
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', String(t.dataset.m === m)));
  if(m === 'other'){
    $('filters').innerHTML = `<form class="search" id="oForm">
      <input id="oQ" type="search" placeholder="会社名・地域で探す" aria-label="会社名・地域で探す" value="${esc(oQ)}">
      <select id="oSt" aria-label="大房側のステータス">${OTHER_ST.map(x=>`<option${x===oSt?' selected':''}>${esc(x)}</option>`).join('')}</select>
      <button class="btn">探す</button></form>`;
    $('oForm').addEventListener('submit', e => { e.preventDefault(); oQ = $('oQ').value.trim(); oSt = $('oSt').value; currentId = null; renderDetail(); searchOther(false); });
    if(others.length) renderOther(); else if(pw) searchOther(false);
  } else renderList();
  renderDetail();
}
document.querySelector('.tabs').addEventListener('click', e => {
  const t = e.target.closest('.tab'); if(t && t.dataset.m !== mode) setMode(t.dataset.m);
});
async function searchOther(more){
  if(!more){ others = []; $('rows').innerHTML = '<div class="empty">探しています</div>'; }
  try{
    const st = oSt === '未接触を除く' ? '__active' : (oSt === 'すべて' ? '' : oSt);
    const r = await rpc('suga_search', {p_pw: pw, p_q: oQ, p_status: st, p_offset: others.length});
    if(mode !== 'other') return;
    others = others.concat(r.rows); oTotal = r.total; renderOther();
  }catch(err){
    if(mode === 'other') $('rows').innerHTML = '<div class="empty">読み込めませんでした。もう一度「探す」を押してください。</div>';
  }
}
function renderOther(){
  $('cnt').textContent = `その他の会社 ${Number(oTotal).toLocaleString()}件`;
  const rest = oTotal - others.length;
  $('rows').innerHTML = others.length ? others.map(l =>
    `<button type="button" class="row" data-id="${esc(l.reg_no)}" aria-current="${l.reg_no===currentId}">
      <span class="nm">${esc(l.name)}</span>
      <span class="meta"><span class="st">${esc(l.status || '未設定')}</span>${l.pref?`<span>${esc(l.pref)}</span>`:''}</span></button>`
    ).join('') + (rest > 0 ? `<button type="button" class="more" id="more">続きを表示する（残り${rest.toLocaleString()}件）</button>` : '')
    : '<div class="empty">条件に合う会社はありません。言葉を変えて探してください。</div>';
}

function renderList(){
  if(mode === 'other'){ renderOther(); return; }
  $('cnt').textContent = `菅沼案件 ${leads.length}件`;
  const counts = {}; leads.forEach(l => { const s = sugaSt(l); counts[s] = (counts[s]||0)+1; });
  $('filters').innerHTML = ['すべて', ...STATUSES].filter(s => s === 'すべて' || counts[s])
    .map(s => `<button type="button" class="chip" aria-pressed="${s===filter}" data-f="${esc(s)}">${esc(s)} ${s==='すべて'?leads.length:counts[s]}</button>`).join('');
  const shown = leads.filter(l => filter === 'すべて' || sugaSt(l) === filter);
  $('rows').innerHTML = shown.length ? shown.map(l => {
    const s = sugaSt(l), nd = l.suga && l.suga.next_action_date;
    return `<button type="button" class="row" data-id="${esc(l.reg_no)}" aria-current="${l.reg_no===currentId}">
      <span class="nm">${esc(l.name)}</span>
      <span class="meta"><span class="st ${ST_CLASS[s]||''}">${esc(s)}</span>
      ${l.pref?`<span>${esc(l.pref)}</span>`:''}${nd?`<span>次回 ${esc(fmtD(nd))}</span>`:''}</span></button>`;
  }).join('') : `<div class="empty">${leads.length ? 'この状況の案件はありません。' : '菅沼案件はまだ登録されていません。'}</div>`;
}
$('filters').addEventListener('click', e => {
  const b = e.target.closest('[data-f]'); if(!b) return;
  filter = b.dataset.f; renderList();
});
$('rows').addEventListener('click', e => {
  if(e.target.id === 'more'){ e.target.disabled = true; searchOther(true); return; }
  const b = e.target.closest('[data-id]'); if(!b) return;
  currentId = b.dataset.id; renderList(); renderDetail();
  $('app').classList.add('viewing'); $('detail').scrollTop = 0;
});

function row(dt, dd){ return `<dt>${esc(dt)}</dt><dd>${dd ? dd : '<span style="color:#9aa5a1">未入力</span>'}</dd>`; }
function join(a, b){ return [a, b].filter(Boolean).map(esc).join('　'); }

function renderDetail(){
  const el = $('detail');
  const isSuga = mode === 'suga';
  const l = (isSuga ? leads : others).find(x => x.reg_no === currentId);
  if(!l){ $('app').classList.remove('viewing');
    el.innerHTML = `<div class="empty">左の一覧から会社を選ぶと、詳細が表示されます。</div>`; return; }
  const s = l.suga || {};
  const attacks = [l.attack100&&'アタックS', l.attack_nb&&'アタック中林', l.attack_km&&'アタック亀谷', l.attack_sg&&'菅沼案件'].filter(Boolean).join('、');
  const site = l.website && /^https?:\/\//i.test(l.website) ? `<a href="${esc(l.website)}" target="_blank" rel="noopener noreferrer">ホームページ</a>` : '';
  el.innerHTML = `
    <button type="button" class="back" id="back">一覧に戻る</button>
    <h2>${esc(l.name)}</h2>
    <p class="loc">${esc([l.pref,l.city,l.address].filter(Boolean).join(''))}${l.tel?`　電話 ${esc(l.tel)}`:''}${l.rep_name?`　代表 ${esc(l.rep_name)}`:''}${site?`　${site}`:''}</p>
    <div class="cols${isSuga ? '' : ' one'}">
      ${isSuga ? `<section class="panel mine">
        <h3>菅沼さんの管理</h3>
        <p class="note">ここの内容は大房側の営業管理とは別に保存されます。</p>
        <div class="two">
          <div class="fld"><label for="fSt">状況</label>
            <select id="fSt">${STATUSES.map(x=>`<option${x===(s.status||'未着手')?' selected':''}>${esc(x)}</option>`).join('')}</select></div>
          <div class="fld"><label for="fKk">確度</label>
            <select id="fKk"><option value="">未設定</option>${KAKUDO.map(x=>`<option${x===s.kakudo?' selected':''}>${esc(x)}</option>`).join('')}</select></div>
        </div>
        <div class="two">
          <div class="fld"><label for="fNa">次にやること</label><input id="fNa" maxlength="500" value="${esc(s.next_action)}"></div>
          <div class="fld"><label for="fNd">その予定日</label><input id="fNd" type="date" value="${esc(s.next_action_date||'')}"></div>
        </div>
        <div class="fld"><label for="fMemo">メモ</label><textarea id="fMemo" maxlength="5000">${esc(s.memo)}</textarea></div>
        <div class="saveline"><button type="button" class="btn" id="save">保存する</button>
          <span id="saveMsg">${s.updated_at?`最終保存 ${esc(fmtDT(s.updated_at))}`:''}</span></div>
        <div class="thread">
          <h3>コメント</h3>
          <div id="cms">${(l.comments||[]).map(cmHtml).join('') || '<p class="note" id="noCm">コメントはまだありません。</p>'}</div>
          <div class="cmform"><textarea id="cmBody" maxlength="2000" placeholder="大房側に伝えたいことを書く" aria-label="コメント"></textarea>
            <button type="button" class="btn ghost" id="cmAdd">コメントする</button></div>
        </div>
      </section>` : ''}
      <section class="panel">
        <h3>大房側の営業状況</h3>
        <p class="note">${isSuga ? '大房側で更新している内容です。ここでは変更できません。' : '菅沼案件ではない会社です。見るだけで、状況やコメントは書けません。'}</p>
        <dl>
          ${row('ステータス', esc(l.status))}
          ${row('営業ランク', esc(l.lead_rank))}
          ${row('担当者', esc(l.staff))}
          ${row('支援者数', l.supporter_count!=null ? esc(l.supporter_count)+'人' : '')}
          ${row('想定支援者数', l.expected_supporter!=null ? esc(l.expected_supporter)+'人' : '')}
          ${row('アタックリスト', esc(attacks))}
          ${row('書類作成方法', esc(l.doc_method))}
          ${row('初回接触日', join(fmtD(l.first_contact_date), l.first_contact_kind))}
          ${row('商談予定日', join(fmtD(l.meeting_date), l.meeting_kind))}
          ${row('ネクストアクション', join(l.next_action_kind, l.next_action) + (l.next_action_date?`　${esc(fmtD(l.next_action_date))}`:''))}
          ${row('登録番号', esc(l.reg_no))}
        </dl>
      </section>
    </div>`;
  $('back').addEventListener('click', () => $('app').classList.remove('viewing'));
  if(isSuga){
    $('save').addEventListener('click', () => save(l));
    $('cmAdd').addEventListener('click', () => addComment(l));
  }
}
function cmHtml(c){ return `<div class="cm"><time>${esc(fmtDT(c.created_at))}　${esc(c.author)}</time><p>${esc(c.body)}</p></div>`; }

async function save(l){
  const btn = $('save'), msg = $('saveMsg'); btn.disabled = true; msg.className = ''; msg.textContent = '保存しています';
  try{
    l.suga = await rpc('suga_save', {p_pw: pw, p_reg_no: l.reg_no, p_status: $('fSt').value, p_kakudo: $('fKk').value,
      p_next_action: $('fNa').value, p_next_action_date: $('fNd').value || null, p_memo: $('fMemo').value});
    msg.className = 'ok'; msg.textContent = `保存しました（${fmtDT(l.suga.updated_at)}）`;
    renderList();
  }catch(err){
    msg.className = 'ng'; msg.textContent = err.auth ? 'パスワードが変更されました。ログアウトして入り直してください。'
      : '保存できませんでした。通信状況を確認して、もう一度「保存する」を押してください。';
  }
  btn.disabled = false;
}
async function addComment(l){
  const ta = $('cmBody'), body = ta.value.trim(); if(!body){ ta.focus(); return; }
  const btn = $('cmAdd'); btn.disabled = true;
  try{
    const c = await rpc('suga_comment_add', {p_pw: pw, p_reg_no: l.reg_no, p_body: body});
    (l.comments = l.comments || []).push(c);
    const no = $('noCm'); if(no) no.remove();
    $('cms').insertAdjacentHTML('beforeend', cmHtml(c)); ta.value = '';
  }catch(err){ alert('コメントできませんでした。通信状況を確認して、もう一度お試しください。'); }
  btn.disabled = false;
}

// 同じタブを開いている間は入力し直さずに済むようにする
(async () => {
  let saved = ''; try{ saved = sessionStorage.getItem('suga_pw') || ''; }catch(e){}
  if(!saved) return;
  pw = saved;
  try{ await load(); $('gate').hidden = true; $('app').hidden = false; }
  catch(e){ pw = ''; try{ sessionStorage.removeItem('suga_pw'); }catch(_){} }
})();
</script>
