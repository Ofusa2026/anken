<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>国交省管理システム</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --navy:#0f2040; --blue:#2563eb; --blue-light:#eff6ff;
  --green:#16a34a; --orange:#ea580c; --red:#dc2626; --purple:#7c3aed; --slate:#64748b;
  --gray-100:#f1f5f9; --gray-200:#e2e8f0; --gray-400:#94a3b8; --gray-700:#334155;
  --white:#ffffff; --shadow:0 2px 12px rgba(0,0,0,0.08);
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--gray-100);color:var(--navy);}
.app{display:flex;height:100vh;overflow:hidden;}

/* sidebar */
.sidebar{width:220px;background:var(--navy);flex-shrink:0;display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:100;overflow-y:auto;}
.sidebar-logo{padding:16px 16px 12px;}
.logo-box{background:white;border-radius:8px;padding:8px 10px;margin-bottom:8px;display:flex;align-items:center;justify-content:center;}
.logo-box img{width:100%;height:auto;display:block;}
.logo-title{font-size:12px;font-weight:700;color:white;line-height:1.3;}
.logo-ver{font-size:9px;color:rgba(255,255,255,.4);margin-top:3px;letter-spacing:.3px;}
.sidebar-section{padding:14px 16px 4px;font-size:10px;color:#475569;font-weight:700;letter-spacing:1px;text-transform:uppercase;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 16px;color:#94a3b8;font-size:13px;cursor:pointer;border-radius:6px;margin:1px 8px;transition:.15s;}
.nav-item:hover,.nav-item.active{background:rgba(255,255,255,0.1);color:white;}
.nav-item .badge{background:#2563eb;color:white;font-size:10px;padding:1px 7px;border-radius:10px;margin-left:auto;font-weight:700;}

/* main */
.main{margin-left:220px;flex:1;display:flex;flex-direction:column;min-width:0;height:100vh;}
.topbar{background:white;border-bottom:1px solid var(--gray-200);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-shrink:0;}
.page-title{font-size:18px;font-weight:800;color:var(--navy);}
.topbar-actions{display:flex;gap:8px;align-items:center;}
.search-box{border:1.5px solid var(--gray-200);border-radius:8px;padding:7px 12px;font-size:13px;width:220px;outline:none;}
.search-box:focus{border-color:var(--blue);}
.btn{border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;transition:.15s;}
.btn-primary{background:var(--blue);color:white;}
.btn-primary:hover{background:#1d4ed8;}
.btn-outline{background:white;border:1.5px solid var(--gray-200);color:var(--navy);}
.btn-outline:hover{border-color:var(--blue);color:var(--blue);}

/* stats */
.stats{display:flex;gap:10px;padding:14px 24px 6px;}
.stat-card{background:white;border-radius:8px;padding:10px 14px;box-shadow:var(--shadow);border:1px solid var(--gray-200);flex:1;min-width:0;}
.stat-label{font-size:11px;color:var(--gray-400);font-weight:600;margin-bottom:4px;}
.stat-num{font-size:26px;font-weight:800;line-height:1;}

/* board */
.board{display:flex;gap:14px;padding:10px 24px 24px;overflow-x:auto;flex:1;align-items:flex-start;}
.lane{background:#f1f5f9;border-radius:14px;min-width:300px;max-width:300px;display:flex;flex-direction:column;max-height:calc(100vh - 200px);border:1.5px solid #e2e8f0;box-shadow:0 2px 8px rgba(0,0,0,.05);}
.lane-header{padding:11px 16px;display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:800;color:white;border-radius:12px 12px 0 0;}
.lane-count{background:rgba(255,255,255,.25);border-radius:10px;padding:1px 9px;font-size:12px;}
.lane-body{padding:8px 10px;overflow-y:auto;flex:1;min-height:60px;}
.lane.dragover .lane-body{background:rgba(37,99,235,.06);outline:2px dashed var(--blue);outline-offset:-6px;border-radius:10px;}

.card{background:white;border-radius:10px;padding:11px 13px;margin-bottom:8px;box-shadow:0 1px 4px rgba(0,0,0,.08);cursor:grab;border-left:3px solid var(--blue);font-size:13px;position:relative;transition:all .15s;}
.card:hover{box-shadow:0 4px 14px rgba(0,0,0,.12);transform:translateY(-1px);}
.card.dragging{opacity:.5;box-shadow:0 6px 20px rgba(0,0,0,.2);}
.card-title{font-weight:700;color:var(--navy);margin-bottom:5px;word-break:break-word;display:flex;align-items:center;gap:6px;}
.tag{display:inline-block;font-size:10px;font-weight:700;padding:1px 7px;border-radius:5px;background:var(--blue-light);color:var(--blue);flex-shrink:0;}
.card-snip{font-size:11px;color:var(--gray-700);line-height:1.5;max-height:48px;overflow:hidden;white-space:pre-wrap;word-break:break-word;}
.card-meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px;}
.chip{font-size:10px;padding:1px 7px;border-radius:5px;background:#f1f5f9;color:var(--gray-700);}
.chip.tel{background:#fef9c3;color:#854d0e;}
.due{font-size:10px;padding:1px 7px;border-radius:5px;}
.due.overdue{background:#fef2f2;color:#dc2626;font-weight:700;}
.due.soon{background:#fffbeb;color:#d97706;font-weight:700;}
.due.ok{background:#f0fdf4;color:#16a34a;}

/* modal */
.overlay{display:none;position:fixed;inset:0;background:rgba(15,32,64,.45);z-index:1000;align-items:center;justify-content:center;padding:20px;}
.overlay.show{display:flex;}
.modal{background:white;border-radius:16px;width:620px;max-width:96vw;max-height:92vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.25);}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--gray-200);display:flex;justify-content:space-between;align-items:center;}
.modal-head h3{margin:0;font-size:16px;font-weight:800;}
.modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:var(--gray-400);line-height:1;}
.modal-body{padding:18px 20px;overflow-y:auto;}
.fld{margin-bottom:14px;}
.fld label{display:block;font-size:11px;font-weight:700;color:var(--gray-700);margin-bottom:5px;}
.fld input,.fld select,.fld textarea{width:100%;border:1.5px solid var(--gray-200);border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit;outline:none;}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--blue);}
.fld textarea{resize:vertical;min-height:64px;white-space:pre-wrap;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.modal-foot{padding:14px 20px;border-top:1px solid var(--gray-200);display:flex;justify-content:space-between;gap:8px;}
.btn-danger{background:white;border:1.5px solid var(--red);color:var(--red);}
.btn-danger:hover{background:#fef2f2;}
.btn-ghost{background:none;border:none;color:var(--gray-400);font-size:12px;cursor:pointer;}

.loading{position:fixed;inset:0;background:rgba(255,255,255,.75);z-index:2000;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:var(--navy);font-weight:700;}
.loading.show{display:flex;}
.spinner{width:34px;height:34px;border:4px solid var(--gray-200);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--navy);color:white;padding:11px 20px;border-radius:10px;font-size:13px;font-weight:700;z-index:3000;opacity:0;transition:opacity .3s;box-shadow:0 8px 24px rgba(0,0,0,.25);}
.toast.show{opacity:1;}
.empty-lane{text-align:center;color:#cbd5e1;font-size:12px;padding:18px 0;}
</style>
</head>

      <input type="hidden" id="f_id">

          <option>未着手</option><option>企業ボール</option><option>補正可能</option><option>補正完了</option>

      <div class="fld"><label>補正対応事項（社内）</label><textarea id="f_content_internal"></textarea></div>
      <div class="fld"><label>国交省確認事項</label><textarea id="f_kokko_kakunin"></textarea></div>
      <div class="grid2">
        <div class="fld"><label>補正可能日</label><input type="date" id="f_hosei_kano_date"></div>
        <div class="fld"><label>補正対応期限</label><input type="date" id="f_kigen_date"></div>
        <div class="fld"><label>案内日</label><input type="date" id="f_annai_date"></div>

      </div>

        <button class="btn btn-primary" onclick="saveRecord()">保存</button>

<script>
var SUPABASE_URL = 'https://ehwlgbwpycglmopiqyty.supabase.co';
var SUPABASE_KEY = 'sb_publishable_3ptyILIpGIcNA5sUBhFMbA_n0VxpY2u';
var TABLE = 'kokko_hosei';
var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

var LANES = [
  {key:'未着手',   color:'#64748b'},
  {key:'企業ボール', color:'#ea580c'},
  {key:'補正可能',  color:'#2563eb'},
  {key:'補正完了',  color:'#16a34a'}
];
var COLOR = {}; LANES.forEach(function(l){COLOR[l.key]=l.color;});

var DATA = [];
var view = 'board';
var dragId = null;

function showLoading(t){document.getElementById('loadingText').textContent=t||'読み込み中…';document.getElementById('loading').classList.add('show');}
function hideLoading(){document.getElementById('loading').classList.remove('show');}
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2200);}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

async function loadData(){
  showLoading();
  try{
    var r = await sb.from(TABLE).select('*').order('status').order('sort_order',{nullsFirst:false});
    if(r.error) throw r.error;
    DATA = r.data||[];
    render();
  }catch(e){ toast('読み込み失敗: '+(e.message||e)); console.error(e); }
  hideLoading();
}

function matchSearch(rec){
  var q = document.getElementById('search').value.trim();
  if(!q) return true;
  return (rec.company_name||'').indexOf(q)>=0 || (rec.name_tag||'').indexOf(q)>=0;
}

function dueClass(d){
  if(!d) return '';
  var today = new Date(); today.setHours(0,0,0,0);
  var due = new Date(d+'T00:00:00');
  var diff = Math.round((due-today)/86400000);
  if(diff<0) return 'overdue';
  if(diff<=3) return 'soon';
  return 'ok';
}

function render(){
  document.getElementById('navTotal').textContent = DATA.length;
  // stats
  var statsEl = document.getElementById('stats');
  var html = '';
  LANES.forEach(function(l){
    var n = DATA.filter(function(r){return r.status===l.key;}).length;
    html += '<div class="stat-card"><div class="stat-label">'+l.key+'</div><div class="stat-num" style="color:'+l.color+'">'+n+'</div></div>';
  });
  html += '<div class="stat-card"><div class="stat-label">合計</div><div class="stat-num" style="color:var(--navy)">'+DATA.length+'</div></div>';
  statsEl.innerHTML = html;

  if(view==='board'){ renderBoard(); } else { renderList(); }
}

function renderBoard(){
  document.getElementById('board').style.display='flex';
  document.getElementById('listView').style.display='none';
  var board = document.getElementById('board');
  board.innerHTML = '';
  LANES.forEach(function(l){
    var lane = document.createElement('div');
    lane.className='lane'; lane.dataset.status=l.key;
    var recs = DATA.filter(function(r){return r.status===l.key && matchSearch(r);});
    lane.innerHTML = '<div class="lane-header" style="background:'+l.color+'">'+l.key+'<span class="lane-count">'+recs.length+'</span></div>';
    var body = document.createElement('div'); body.className='lane-body';
    if(recs.length===0){ body.innerHTML='<div class="empty-lane">該当なし</div>'; }
    recs.forEach(function(r){ body.appendChild(cardEl(r,l.color)); });
    // drag targets
    lane.addEventListener('dragover',function(e){e.preventDefault();lane.classList.add('dragover');});
    lane.addEventListener('dragleave',function(){lane.classList.remove('dragover');});
    lane.addEventListener('drop',function(e){e.preventDefault();lane.classList.remove('dragover');onDrop(l.key);});
    lane.appendChild(body);
    board.appendChild(lane);
  });
}

function cardEl(r,color){
  var c = document.createElement('div');
  c.className='card'; c.style.borderLeftColor=color; c.draggable=true; c.dataset.id=r.id;
  var snip = r.content_company || r.content_internal || r.kokko_kakunin || '';
  var meta = '';
  if(r.hosei_kano_date) meta += '<span class="chip">可能日 '+r.hosei_kano_date+'</span>';
  if(r.kigen_date) meta += '<span class="due '+dueClass(r.kigen_date)+'">期限 '+r.kigen_date+'</span>';
  if(r.annai_date) meta += '<span class="chip">案内 '+r.annai_date+'</span>';
  if(r.saisoku_date) meta += '<span class="chip">催促 '+r.saisoku_date+'</span>';
  if(r.shinsei_date) meta += '<span class="chip">申請 '+r.shinsei_date+'</span>';
  if(r.tel) meta += '<span class="chip tel">☎ '+esc(r.tel.split('\n')[0])+'</span>';
  c.innerHTML =
    '<div class="card-title">'+(r.name_tag?'<span class="tag">'+esc(r.name_tag)+'</span>':'')+'<span>'+esc(r.company_name||'(無名)')+'</span></div>'+
    (snip?'<div class="card-snip">'+esc(snip)+'</div>':'')+
    (meta?'<div class="card-meta">'+meta+'</div>':'');
  c.addEventListener('click',function(){openDetail(r.id);});
  c.addEventListener('dragstart',function(e){dragId=r.id;c.classList.add('dragging');e.dataTransfer.effectAllowed='move';});
  c.addEventListener('dragend',function(){c.classList.remove('dragging');dragId=null;});
  return c;
}

async function onDrop(newStatus){
  if(!dragId) return;
  var rec = DATA.find(function(r){return r.id===dragId;});
  if(!rec || rec.status===newStatus) return;
  var old = rec.status;
  rec.status = newStatus; render();
  try{
    var r = await sb.from(TABLE).update({status:newStatus, updated_at:new Date().toISOString()}).eq('id',rec.id);
    if(r.error) throw r.error;
    toast(rec.company_name+' → '+newStatus);
  }catch(e){ rec.status=old; render(); toast('移動失敗: '+(e.message||e)); }
}

/* ---- list view ---- */
function renderList(){
  document.getElementById('board').style.display='none';
  var lv = document.getElementById('listView');
  lv.style.display='block';
  var recs = DATA.filter(matchSearch);
  var rows = recs.map(function(r){
    return '<tr onclick="openDetail(\''+r.id+'\')" style="cursor:pointer;border-bottom:1px solid var(--gray-200);">'+
      '<td style="padding:8px 10px;"><span class="tag" style="background:'+COLOR[r.status]+'22;color:'+COLOR[r.status]+'">'+esc(r.status)+'</span></td>'+
      '<td style="padding:8px 10px;font-weight:700;">'+(r.name_tag?'['+esc(r.name_tag)+'] ':'')+esc(r.company_name||'')+'</td>'+
      '<td style="padding:8px 10px;font-size:12px;color:var(--gray-700);">'+esc((r.content_company||r.content_internal||'').slice(0,50))+'</td>'+
      '<td style="padding:8px 10px;font-size:12px;">'+(r.kigen_date?'<span class="due '+dueClass(r.kigen_date)+'">'+r.kigen_date+'</span>':'')+'</td>'+
      '<td style="padding:8px 10px;font-size:12px;">'+esc(r.shinsei_date||'')+'</td></tr>';
  }).join('');
  lv.innerHTML = '<div style="background:white;border-radius:12px;box-shadow:var(--shadow);overflow:hidden;">'+
    '<table style="width:100%;border-collapse:collapse;font-size:13px;">'+
    '<thead><tr style="background:var(--gray-100);text-align:left;font-size:11px;color:var(--gray-700);">'+
    '<th style="padding:9px 10px;">ステータス</th><th style="padding:9px 10px;">法人名</th><th style="padding:9px 10px;">補正内容</th><th style="padding:9px 10px;">期限</th><th style="padding:9px 10px;">申請日</th></tr></thead>'+
    '<tbody>'+rows+'</tbody></table></div>';
}

function setView(v){
  view=v;
  document.getElementById('nav-board').classList.toggle('active',v==='board');
  document.getElementById('nav-list').classList.toggle('active',v==='list');
  render();
}

/* ---- modal ---- */
function setVal(id,v){document.getElementById(id).value = v==null?'':v;}
function openDetail(id){
  var r = DATA.find(function(x){return x.id===id;}); if(!r) return;
  document.getElementById('modalTitle').textContent = r.company_name||'補正案件';
  document.getElementById('delBtn').style.display='inline-block';
  setVal('f_id',r.id); setVal('f_company_name',r.company_name); setVal('f_name_tag',r.name_tag);
  setVal('f_status',r.status); setVal('f_content_company',r.content_company);
  setVal('f_content_internal',r.content_internal); setVal('f_kokko_kakunin',r.kokko_kakunin);
  setVal('f_hosei_kano_date',r.hosei_kano_date); setVal('f_kigen_date',r.kigen_date);
  setVal('f_annai_date',r.annai_date); setVal('f_saisoku_date',r.saisoku_date);
  setVal('f_shinsei_date',r.shinsei_date); setVal('f_tel',r.tel);
  document.getElementById('overlay').classList.add('show');
}
function openNew(){
  document.getElementById('modalTitle').textContent='新規 補正案件';
  document.getElementById('delBtn').style.display='none';
  ['f_id','f_company_name','f_name_tag','f_content_company','f_content_internal','f_kokko_kakunin','f_hosei_kano_date','f_kigen_date','f_annai_date','f_saisoku_date','f_shinsei_date','f_tel'].forEach(function(i){setVal(i,'');});
  setVal('f_status','未着手');
  document.getElementById('overlay').classList.add('show');
}
function closeModal(){document.getElementById('overlay').classList.remove('show');}

function collect(){
  var d=function(id){var v=document.getElementById(id).value;return v?v:null;};
  return {
    company_name:d('f_company_name'), name_tag:d('f_name_tag'), status:document.getElementById('f_status').value,
    content_company:d('f_content_company'), content_internal:d('f_content_internal'), kokko_kakunin:d('f_kokko_kakunin'),
    hosei_kano_date:d('f_hosei_kano_date'), kigen_date:d('f_kigen_date'), annai_date:d('f_annai_date'),
    saisoku_date:d('f_saisoku_date'), shinsei_date:d('f_shinsei_date'), tel:d('f_tel'),
    updated_at:new Date().toISOString()
  };
}
async function saveRecord(){
  var id=document.getElementById('f_id').value;
  var payload=collect();
  showLoading('保存中…');
  try{
    if(id){
      var r=await sb.from(TABLE).update(payload).eq('id',id);
      if(r.error) throw r.error;
    }else{
      var r2=await sb.from(TABLE).insert([payload]);
      if(r2.error) throw r2.error;
    }
    closeModal(); await loadData(); toast('保存しました');
  }catch(e){ hideLoading(); toast('保存失敗: '+(e.message||e)); console.error(e); }
}
async function delRecord(){
  var id=document.getElementById('f_id').value; if(!id) return;
  if(!confirm('この案件を削除します。よろしいですか？')) return;
  showLoading('削除中…');
  try{
    var r=await sb.from(TABLE).delete().eq('id',id);
    if(r.error) throw r.error;
    closeModal(); await loadData(); toast('削除しました');
  }catch(e){ hideLoading(); toast('削除失敗: '+(e.message||e)); console.error(e); }
}

document.getElementById('overlay').addEventListener('click',function(e){if(e.target.id==='overlay')closeModal();});
loadData();
</script>
</body>
</html>
