<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理部ダッシュボード</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.47.0/tabler-icons.min.css">
<style>
  :root{
    --surface-0:#f6f5f1; --surface-1:#efeee7; --surface-2:#ffffff;
    --border:#e3e1d9; --border-strong:#cdcbc2;
    --text-primary:#242320; --text-secondary:#6b6960; --text-muted:#9a988e;
    --text-accent:#185fa5; --border-accent:#378add; --bg-accent:#e7f1fb;
    --text-warning:#8a5309; --bg-warning:#fbeed7;
    --text-danger:#a52b2b;  --bg-danger:#fce9e9;
    --text-success:#3a6d10; --bg-success:#eaf3dd;
    --radius:8px;
    --font-sans:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0; padding:22px; background:var(--surface-0); font-family:var(--font-sans); color:var(--text-primary);}
  .wrap{max-width:1120px; margin:0 auto;}
  h1.title{font-size:19px; font-weight:600; margin:0 0 14px; display:flex; align-items:center; gap:8px;}
  .app{display:flex; background:var(--surface-1); border-radius:12px; overflow:hidden; border:.5px solid var(--border); min-height:620px;}
  aside{width:230px; flex-shrink:0; background:var(--surface-2); border-right:.5px solid var(--border); display:flex; flex-direction:column; padding:12px 10px;}
  .brand{display:flex; align-items:center; gap:8px; padding:4px 8px 12px; font-size:14px; font-weight:600;}
  .navitem{display:flex; align-items:center; gap:9px; width:100%; text-align:left; border:none; background:transparent; padding:9px 9px; border-radius:var(--radius); font-size:13px; color:var(--text-primary); cursor:pointer; font-family:inherit; margin-bottom:2px;}
  .navitem:hover{background:var(--surface-1);}
  .navitem.on{background:var(--bg-accent); color:var(--text-accent); font-weight:600;}
  .navitem .ic{font-size:17px; color:var(--text-secondary);}
  .navitem.on .ic{color:var(--text-accent);}
  .navitem .nb{margin-left:auto; min-width:20px; height:18px; padding:0 6px; border-radius:9px; font-size:11px; font-weight:600; display:inline-flex; align-items:center; justify-content:center;}
  .navsep{display:flex; align-items:center; gap:5px; width:100%; font-size:11px; color:var(--text-muted); padding:12px 9px 4px; background:transparent; border:none; cursor:pointer; font-family:inherit; text-align:left;}
  .navsep:hover{color:var(--text-secondary);}
  .navsep .chev{font-size:14px; transition:transform .18s;}
  .navsep.collapsed .chev{transform:rotate(-90deg);}
  #catnav{overflow:hidden;}
  #catnav.collapsed{display:none;}
  .foot{margin-top:auto; padding:12px 9px 2px; border-top:.5px solid var(--border); font-size:11px; color:var(--text-muted);}
  main{flex:1; padding:20px 22px; min-width:0; overflow-y:auto;}

  /* dashboard */
  .dhead{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:4px;}
  .dhead h2{font-size:17px; font-weight:600; margin:0; display:flex; align-items:center; gap:8px;}
  .prog{margin-left:auto; display:flex; align-items:center; gap:7px; font-size:12.5px; background:var(--surface-2); border:.5px solid var(--border); border-radius:20px; padding:5px 12px;}
  .prog b{color:var(--text-accent);}
  .dsub{color:var(--text-secondary); font-size:12.5px; margin:0 0 14px;}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:12px;}
  .card{background:var(--surface-2); border:.5px solid var(--border); border-radius:12px; padding:13px 13px 11px; display:flex; flex-direction:column; cursor:default;}
  .card.done{opacity:.6;}
  .chd{display:flex; align-items:center; gap:8px; margin-bottom:9px;}
  .chd .cic{font-size:18px; color:var(--text-accent);}
  .chd .nm{font-size:14px; font-weight:600; cursor:pointer;}
  .chd .nm:hover{text-decoration:underline;}
  .chd .tot{margin-left:auto; font-size:11px; font-weight:600; padding:2px 9px; border-radius:20px;}
  .items{display:flex; flex-direction:column; gap:1px; margin-bottom:9px;}
  .it{display:flex; align-items:center; gap:8px; padding:5px 6px; border-radius:6px; cursor:pointer; font-size:12px;}
  .it:hover{background:var(--surface-1);}
  .dot{width:7px; height:7px; border-radius:50%; flex-shrink:0;}
  .d-danger{background:var(--text-danger);} .d-warning{background:var(--text-warning);}
  .d-success{background:var(--text-success);} .d-none{background:var(--border-strong);}
  .it .lbl{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .it .cnt{font-weight:600;}
  .c-danger{color:var(--text-danger);} .c-warning{color:var(--text-warning);}
  .c-success{color:var(--text-success);} .c-none{color:var(--text-muted); font-weight:400;}
  .it .sub2{font-size:10px; color:var(--text-muted); margin-left:4px;}
  .chk{display:inline-flex; align-items:center; gap:5px; font-size:11px; color:var(--text-secondary); cursor:pointer; user-select:none; padding:3px 8px; border:.5px solid var(--border-strong); border-radius:20px; align-self:flex-start; margin-bottom:9px;}
  .chk.on{background:var(--bg-success); color:var(--text-success); border-color:transparent;}
  .chk input{display:none;}
  .memo label{display:flex; align-items:center; gap:5px; font-size:10.5px; color:var(--text-muted); margin-bottom:4px;}
  .memo textarea{width:100%; min-height:40px; resize:vertical; border:.5px solid var(--border); border-radius:6px; padding:6px 8px; font-family:inherit; font-size:12px; color:var(--text-primary); background:var(--surface-0);}
  .memo textarea:focus{outline:none; border-color:var(--border-accent); background:var(--surface-2);}
  .saved{font-size:10px; color:var(--text-success); opacity:0; transition:opacity .3s; margin-left:auto;}
  .saved.show{opacity:1;}

  /* category detail (board) */
  .back{display:inline-flex; align-items:center; gap:5px; font-size:12.5px; color:var(--text-accent); background:transparent; border:none; cursor:pointer; padding:0 0 10px; font-family:inherit;}
  .cathead{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  .cathead h2{font-size:18px; font-weight:600; margin:0;}
  .cathead .tot{font-size:11.5px; font-weight:600; padding:3px 10px; border-radius:20px;}
  .ctrls{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:14px; background:var(--surface-2); border:.5px solid var(--border); border-radius:10px; padding:9px 12px;}
  .ctrls .cl{font-size:12px; color:var(--text-secondary); display:inline-flex; align-items:center; gap:6px;}
  .ctrls select{font-family:inherit; font-size:12.5px; padding:5px 8px; border:.5px solid var(--border-strong); border-radius:6px; background:var(--surface-0); color:var(--text-primary); cursor:pointer;}
  .ctrls .clearbtn{font-family:inherit; font-size:12px; padding:5px 11px; border:.5px solid var(--border-strong); border-radius:6px; background:transparent; color:var(--text-secondary); cursor:pointer; display:inline-flex; align-items:center; gap:4px;}
  .ctrls .clearbtn:hover{background:var(--surface-1);}
  .ctrls .fnote{font-size:11.5px; color:var(--text-accent); margin-left:auto;}
  .board{display:flex; gap:12px; overflow-x:auto; padding-bottom:10px; align-items:flex-start;}
  .col{flex:0 0 278px; background:var(--surface-1); border:.5px solid var(--border); border-radius:10px; padding:10px 9px;}
  .colhd{display:flex; align-items:center; gap:7px; margin-bottom:10px; font-size:12.5px; font-weight:600;}
  .colhd .cbadge{font-size:10.5px; font-weight:600; padding:1px 8px; border-radius:20px; margin-left:auto;}
  .colsub{font-size:10px; color:var(--text-muted); font-weight:400; margin-left:2px;}
  .empty{font-size:12px; color:var(--text-muted); padding:6px 2px 4px;}
  .kase{background:var(--surface-2); border:.5px solid var(--border); border-radius:9px; padding:10px 10px; margin-bottom:8px;}
  .kase.done{opacity:.55;}
  .k1{display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:4px;}
  .kn{font-size:12.5px; font-weight:600;}
  .tag{display:inline-block; padding:1px 7px; border-radius:12px; font-size:10px; font-weight:600;}
  .t-danger{background:var(--bg-danger); color:var(--text-danger);}
  .t-warning{background:var(--bg-warning); color:var(--text-warning);}
  .t-success{background:var(--bg-success); color:var(--text-success);}
  .t-accent{background:var(--bg-accent); color:var(--text-accent);}
  .kmeta{font-size:11px; color:var(--text-secondary); margin-bottom:2px; line-height:1.4;}
  .kquote{font-size:10.5px; color:var(--text-muted); background:var(--surface-1); border-left:2px solid var(--border-strong); padding:5px 8px; border-radius:0 6px 6px 0; margin:6px 0; line-height:1.4;}
  .kase textarea{width:100%; min-height:36px; resize:vertical; border:.5px solid var(--border); border-radius:6px; padding:6px 7px; font-family:inherit; font-size:11.5px; background:var(--surface-0); margin-top:6px;}
  .kase textarea:focus{outline:none; border-color:var(--border-accent); background:var(--surface-2);}
  .krow{display:flex; align-items:center; gap:6px; margin-top:7px; flex-wrap:wrap;}
  .kbtn{border:.5px solid var(--border-strong); background:transparent; border-radius:6px; padding:4px 9px; font-size:11px; cursor:pointer; font-family:inherit; color:var(--text-accent); white-space:nowrap; display:inline-flex; align-items:center; gap:4px;}
  .kforce{border:.5px solid var(--text-danger); background:transparent; border-radius:6px; padding:4px 9px; font-size:11px; cursor:pointer; font-family:inherit; color:var(--text-danger); white-space:nowrap; display:inline-flex; align-items:center; gap:4px;}
  .kforce:hover{background:var(--bg-danger);}
  .appcard{background:var(--surface-2); border:.5px solid var(--border); border-radius:9px; padding:11px 11px; margin-bottom:8px;}
  .appcard.done{opacity:.62;}
  .apbtn{border:none; border-radius:6px; padding:6px 13px; font-size:12px; cursor:pointer; font-family:inherit; display:inline-flex; align-items:center; gap:4px; font-weight:600;}
  .apbtn.ok{background:var(--text-success); color:#fff;}
  .apbtn.ng{background:transparent; color:var(--text-danger); border:.5px solid var(--text-danger);}
  .apbtn.ng:hover{background:var(--bg-danger);}
  .kdone{display:inline-flex; align-items:center; gap:4px; font-size:10.5px; color:var(--text-secondary); cursor:pointer; user-select:none; padding:4px 9px; border:.5px solid var(--border-strong); border-radius:20px; white-space:nowrap;}
  .kdone.on{background:var(--bg-success); color:var(--text-success); border-color:transparent;}
  .kdone input{display:none;}
  .csaved{font-size:10px; color:var(--text-success); opacity:0; transition:opacity .3s; margin-left:auto;}
  .csaved.show{opacity:1;}
</style>
</head>

const totBg={danger:'--bg-danger',warning:'--bg-warning',success:'--bg-success',none:'--surface-1'};
const totFg={danger:'--text-danger',warning:'--text-warning',success:'--text-success',none:'--text-muted'};

function lsGet(k,d){try{const v=localStorage.getItem(k);return v===null?d:v;}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function catTone(c){
  const t=c.subs.map(s=>s.tone);
  if(t.includes('danger'))return'danger';
  if(t.includes('warning'))return'warning';
  if(t.every(x=>x==='success'||x==='none'))return'success';
  return'none';
}
function catTotal(c){return c.subs.reduce((s,x)=>s+(typeof x.count==='number'?x.count:0),0);}

let view='dash';
let catFilter='';

function renderNav(){

    const on = view===c.id;
    const nb = tot>0 ? `<span class="nb" style="background:var(${totBg[tone]});color:var(${totFg[tone]})">${tot>999?(Math.floor(tot/1000)+'k+'):tot}</span>` : '';
    return `<button class="navitem ${on?'on':''}" data-view="${c.id}"><i class="ti ${c.icon} ic"></i><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${c.name}</span>${nb}</button>`;
  }).join('');
  document.querySelectorAll('.navitem').forEach(b=>b.onclick=()=>{view=b.dataset.view; // カテゴリ一覧の開閉
(function(){
  const btn=document.getElementById('catToggle');
  const list=document.getElementById('catnav');
  function apply(collapsed){
    btn.classList.toggle('collapsed', collapsed);
    list.classList.toggle('collapsed', collapsed);
  }
  apply(lsGet('kanribu_catcollapsed','0')==='1');
  btn.onclick=()=>{
    const now=!list.classList.contains('collapsed');
    apply(now);
    lsSet('kanribu_catcollapsed', now?'1':'0');
  };
})();
renderNav(); renderMain();});
  document.querySelectorAll('.navitem').forEach(b=>{ if(b.dataset.view===view) b.classList.add('on'); });
}

function renderMain(){
  if(view==='dash') return renderDash();
  if(view==='shonin') return renderShonin();
  const c=cats.find(x=>x.id===view);
  renderCat(c);
}

function renderDash(){
  const cards = cats.map(c=>{
    const tone=catTone(c), tot=catTotal(c);
    const checked = lsGet('kanribu_chk_'+c.id,'0')==='1';
    const items = c.subs.map(s=>{
      const cval = s.count===null?'—':s.count.toLocaleString();
      const cls = s.count===null?'none':s.tone;
      return `<div class="it" data-goto="${c.id}"><span class="dot d-${cls}"></span><span class="lbl">${s.label}${s.sub?`<span class="sub2">${s.sub}</span>`:''}</span><span class="cnt c-${cls}">${cval}</span></div>`;
    }).join('');
    return `<div class="card ${checked?'done':''}" id="card-${c.id}">
      <div class="chd"><i class="ti ${c.icon} cic"></i><span class="nm" data-goto="${c.id}">${c.name}</span>
        <span class="tot" style="background:var(${totBg[tone]});color:var(${totFg[tone]})">${tot>0?('要対応 '+tot.toLocaleString()):'—'}</span></div>
      <div class="items">${items}</div>
      <label class="chk ${checked?'on':''}"><input type="checkbox" data-chk="${c.id}" ${checked?'checked':''}><i class="ti ti-${checked?'circle-check-filled':'circle-check'}" style="font-size:14px"></i>本日確認済み</label>
      <div class="memo"><label><i class="ti ti-pencil" style="font-size:13px"></i>管理者メモ<span class="saved" id="saved-${c.id}">保存</span></label>
        <textarea data-memo="${c.id}" placeholder="申し送り・要フォローなど">${lsGet('kanribu_memo_'+c.id,'')}</textarea></div>
    </div>`;
  }).join('');
  const done=cats.filter(c=>lsGet('kanribu_chk_'+c.id,'0')==='1').length;
  document.getElementById('main').innerHTML = `
    <div class="dhead"><h2><i class="ti ti-layout-grid" style="color:var(--text-accent)"></i>ダッシュボード</h2>
      <span class="prog"><i class="ti ti-checklist" style="font-size:15px"></i>本日確認 <b>${done}</b> / ${cats.length} カテゴリ</span></div>
    <p class="dsub">全画面の件数を1画面で確認。カテゴリ名・項目をクリックすると詳細（案件一覧）へ。見たら「本日確認済み」でチェック。</p>
    <div class="grid">${cards}</div>`;

  document.querySelectorAll('[data-goto]').forEach(el=>el.onclick=()=>{view=el.dataset.goto; catFilter=''; renderNav(); renderMain(); document.getElementById('main').scrollTop=0;});
  document.querySelectorAll('[data-chk]').forEach(el=>el.onchange=e=>{
    const id=e.target.dataset.chk; lsSet('kanribu_chk_'+id, e.target.checked?'1':'0'); renderDash();
  });
  document.querySelectorAll('[data-memo]').forEach(el=>{
    let t; el.oninput=e=>{const id=e.target.dataset.memo; clearTimeout(t); t=setTimeout(()=>{lsSet('kanribu_memo_'+id,e.target.value); const s=document.getElementById('saved-'+id); s.classList.add('show'); setTimeout(()=>s.classList.remove('show'),1000);},400);};
  });
}

function primaryStaff(s){ if(!s||s==='\u2014') return null; return s.split('\u30fb')[0].split('\uff08')[0].split('/')[0].trim()||null; }
function renderCat(c){
  const tone=catTone(c), tot=catTotal(c);
  const staffSet=[]; c.subs.forEach(s=>(s.cases||[]).forEach(k=>{const p=primaryStaff(k.staff); if(p&&p!=='\u66f8\u985e\u90e8'&&!staffSet.includes(p)) staffSet.push(p);}));
  staffSet.sort();
  const cols = c.subs.map(s=>{
    const cbadge = s.count===null
      ? `<span class="cbadge" style="background:var(--surface-2);color:var(--text-muted)">\u2014</span>`
      : `<span class="cbadge" style="background:var(${totBg[s.tone]});color:var(${totFg[s.tone]})">${s.count.toLocaleString()}\u4ef6</span>`;
    const flist = (s.cases||[]).filter(k=>!catFilter || (k.staff&&k.staff.includes(catFilter)));
    let body;
    if(!flist.length){
      body = `<div class="empty">${catFilter?'\u3053\u306e\u62c5\u5f53\u306e\u6848\u4ef6\u306f\u3042\u308a\u307e\u305b\u3093':(s.count===0?'\u8a72\u5f53\u306a\u3057 \ud83c\udf89':'\uff08\u30b5\u30f3\u30d7\u30eb\u672a\u8a2d\u5b9a\uff09')}</div>`;
    } else {
      const kk = flist.map(k=>{
        const done = lsGet('kanribu_cdone_'+k.id,'0')==='1';
        const tags = k.tags.map(t=>`<span class="tag t-${t[1]}">${t[0]}</span>`).join(' ');
        const q = k.quote ? `<div class="kquote">${k.quote}</div>` : '';
        return `<div class="kase ${done?'done':''}" id="kase-${k.id}">
          <div class="k1"><span class="kn">${k.name}</span>${tags}</div>
          <div class="kmeta">${k.org}</div>
          <div class="kmeta">\u62c5\u5f53\uff1a${k.staff}</div>
          ${q}
          <textarea data-ccmt="${k.id}" placeholder="\u7ba1\u7406\u8005\u30b3\u30e1\u30f3\u30c8\uff08\u3053\u306e\u6848\u4ef6\u5b9b\uff09">${lsGet('kanribu_ccomment_'+k.id,'')}</textarea>
          <div class="krow">
            <button class="kbtn" onclick="alert('\u6848\u4ef6\u3092\u958b\u304f\uff08\u30b5\u30f3\u30d7\u30eb\uff09')"><i class="ti ti-external-link"></i>\u958b\u304f</button>
            <button class="kforce" onclick="alert('\u300c${k.staff}\u300d\u306b\u5f37\u5236\u8868\u793a\uff08\u30b5\u30f3\u30d7\u30eb\uff09')"><i class="ti ti-speakerphone"></i>\u5f37\u5236\u8868\u793a</button>
            <label class="kdone ${done?'on':''}"><input type="checkbox" data-cdone="${k.id}" ${done?'checked':''}><i class="ti ti-${done?'circle-check-filled':'circle-check'}"></i>\u5bfe\u5fdc\u6e08\u307f</label>
            <span class="csaved" id="csaved-${k.id}">\u4fdd\u5b58</span>
          </div>
        </div>`;
      }).join('');
      const more = (!catFilter && s.more) ? `<div class="empty">\u2026\u4ed6 ${s.more.toLocaleString()}\u4ef6</div>` : '';
      body = kk + more;
    }
    return `<div class="col">
      <div class="colhd"><span class="dot d-${s.count===null?'none':s.tone}"></span>${s.label}${s.sub?`<span class="colsub">${s.sub}</span>`:''}${cbadge}</div>
      ${body}
    </div>`;
  }).join('');
  document.getElementById('main').innerHTML = `
    <button class="back" onclick="goDash()"><i class="ti ti-arrow-left"></i>\u30c0\u30c3\u30b7\u30e5\u30dc\u30fc\u30c9\u306b\u623b\u308b</button>
    <div class="cathead"><i class="ti ${c.icon}" style="font-size:22px;color:var(--text-accent)"></i><h2>${c.name}</h2>
      <span class="tot" style="background:var(${totBg[tone]});color:var(${totFg[tone]})">${tot>0?('\u8981\u5bfe\u5fdc\u5408\u8a08 '+tot.toLocaleString()+'\u4ef6'):'\u2014'}</span></div>
    <div class="ctrls">
      <span class="cl"><i class="ti ti-user" style="font-size:15px"></i>\u62c5\u5f53：
        <select id="staffFilter"><option value="">\u5168\u62c5\u5f53</option>${staffSet.map(p=>`<option value="${p}" ${catFilter===p?'selected':''}>${p}</option>`).join('')}</select></span>
      <button class="clearbtn" id="clearFilter"><i class="ti ti-x" style="font-size:14px"></i>\u30af\u30ea\u30a2</button>
      ${catFilter?`<span class="fnote"><i class="ti ti-filter" style="font-size:13px"></i>\u300c${catFilter}\u300d\u3067\u7d5e\u8fbc\u4e2d</span>`:''}
    </div>
    <div class="board">${cols}</div>`;

  document.querySelectorAll('[data-cdone]').forEach(el=>el.onchange=e=>{
    const id=e.target.dataset.cdone; lsSet('kanribu_cdone_'+id, e.target.checked?'1':'0');
    const kase=document.getElementById('kase-'+id); kase.classList.toggle('done', e.target.checked);
    const lab=e.target.closest('.kdone'); lab.classList.toggle('on', e.target.checked);
    lab.querySelector('i').className='ti ti-'+(e.target.checked?'circle-check-filled':'circle-check');
  });
  document.querySelectorAll('[data-ccmt]').forEach(el=>{
    let t; el.oninput=e=>{const id=e.target.dataset.ccmt; clearTimeout(t); t=setTimeout(()=>{lsSet('kanribu_ccomment_'+id,e.target.value); const s=document.getElementById('csaved-'+id); s.classList.add('show'); setTimeout(()=>s.classList.remove('show'),1000);},400);};
  });
  const sf=document.getElementById('staffFilter'); if(sf) sf.onchange=e=>{catFilter=e.target.value; renderCat(c);};
  const cf=document.getElementById('clearFilter'); if(cf) cf.onclick=()=>{catFilter=''; renderCat(c);};
}
function renderShonin(){
  const typeMap={
    sei:{t:'静穏枠申請', ic:'ti-bell-off', dsc:'一定期間アラート（強制表示）を抑制する申請。承認すると期間中は静穏枠に入ります。'},
    teishi:{t:'表示停止申請', ic:'ti-eye-off', dsc:'案件をアラート表示の対象から外す申請。承認すると各アラートから除外されます。'}
  };
  const section=(type)=>{
    const m=typeMap[type];
    const list=approvals.filter(a=>a.type===type);
    const cards = list.map(a=>{
      const st=lsGet('kanribu_appr_'+a.id,''); const decided=st!=='';
      let stag=''; if(st==='approved') stag='<span class="tag t-success">承認済み</span>'; else if(st==='rejected') stag='<span class="tag t-danger">却下</span>';
      const btns = decided
        ? `<button class="kbtn" data-undo="${a.id}"><i class="ti ti-arrow-back-up"></i>取消</button>`
        : `<button class="apbtn ok" data-appr="${a.id}"><i class="ti ti-check"></i>承認</button><button class="apbtn ng" data-rej="${a.id}"><i class="ti ti-x"></i>却下</button>`;
      return `<div class="appcard ${decided?'done':''}">
        <div class="k1"><span class="kn">${a.name}</span>${stag}</div>
        <div class="kmeta">${a.org}</div>
        <div class="kmeta">申請者：${a.staff} ／ 申請日：${a.applied}</div>
        ${a.period&&a.period!=='—'?`<div class="kmeta">期間：${a.period}</div>`:''}
        <div class="kquote">理由：${a.reason}</div>
        <div class="krow">${btns}</div>
      </div>`;
    }).join('') || `<div class="empty">申請はありません 🎉</div>`;
    const pend=list.filter(a=>lsGet('kanribu_appr_'+a.id,'')==='').length;
    const badge = pend>0 ? `<span class="cbadge" style="background:var(--bg-danger);color:var(--text-danger)">未承認 ${pend}</span>` : `<span class="cbadge" style="background:var(--bg-success);color:var(--text-success)">0</span>`;
    return `<div class="col" style="flex:0 0 340px">
      <div class="colhd"><i class="ti ${m.ic}" style="font-size:16px;color:var(--text-accent)"></i>${m.t}${badge}</div>
      <div class="colsub" style="display:block;margin:-4px 0 9px 0;line-height:1.4">${m.dsc}</div>
      ${cards}
    </div>`;
  };
  document.getElementById('main').innerHTML = `
    <div class="cathead"><i class="ti ti-checkbox" style="font-size:22px;color:var(--text-accent)"></i><h2>承認（静穏枠・表示停止）</h2></div>
    <p class="dsub">担当者から出された「静穏枠申請」「表示停止申請」を確認して、承認／却下します。取消でやり直せます。</p>
    <div class="board">${section('sei')}${section('teishi')}</div>`;
  document.querySelectorAll('[data-appr]').forEach(b=>b.onclick=()=>{lsSet('kanribu_appr_'+b.dataset.appr,'approved'); renderNav(); renderShonin();});
  document.querySelectorAll('[data-rej]').forEach(b=>b.onclick=()=>{lsSet('kanribu_appr_'+b.dataset.rej,'rejected'); renderNav(); renderShonin();});
  document.querySelectorAll('[data-undo]').forEach(b=>b.onclick=()=>{lsSet('kanribu_appr_'+b.dataset.undo,''); renderNav(); renderShonin();});
}
function goDash(){view='dash'; catFilter=''; renderNav(); renderMain();}

renderNav(); renderMain();
</script>
</body>
</html>
